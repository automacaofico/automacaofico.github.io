<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Cadastros CCO | FICO</title><link rel="stylesheet" href="../styles.css?v=20260811-1"><style>.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.admin-card{padding:18px}.admin-form{display:grid;grid-template-columns:1fr 2fr;gap:9px;margin:14px 0}.admin-form .wide{grid-column:1/-1}.admin-form button{grid-column:1/-1}.admin-list{display:grid;gap:6px;max-height:560px;overflow:auto}.admin-row{display:grid;grid-template-columns:1fr auto;gap:8px;background:#f4f7f9;padding:10px;border-left:4px solid var(--green)}.admin-row.inactive{border-color:var(--muted);opacity:.65}.admin-row strong,.admin-row span{display:block}.admin-row strong{font-size:10px}.admin-row span{font-size:8px;color:var(--muted);margin-top:3px}.admin-row button{height:31px}.back{color:var(--blue);font-size:10px;font-weight:700;text-decoration:none}@media(max-width:850px){.admin-grid{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="../"><img src="../../../mapa-pendencias/assets/brand/fico-logo-color.png" alt="FICO"><span>CADASTROS DO CCO</span></a><a class="back" href="../">← VOLTAR AO PAINEL</a></header><main><section id="access" class="login card"><p>ADMINISTRAÇÃO</p><h1>Cadastros<br><span>operacionais.</span></h1><form id="access-form"><label>Senha administrativa<input id="admin-password" type="password" required></label><button>ACESSAR CADASTROS</button></form><div id="access-message" class="message" hidden></div></section><section id="content" hidden><div id="message" class="message" hidden></div><div class="admin-grid"><article class="card admin-card"><div class="card-head"><div><p>SOLICITANTES</p><h2>Pessoas autorizadas</h2></div><b id="requester-count">0</b></div><form id="requester-form" class="admin-form"><label>Código<input id="requester-code" placeholder="GAMA01" required></label><label>Nome<input id="requester-name" required></label><label>Função<input id="requester-role"></label><label>Empresa<input id="requester-company"></label><label class="wide">Supervisor<input id="requester-supervisor"></label><button>SALVAR SOLICITANTE</button></form><div id="requesters" class="admin-list"></div></article><article class="card admin-card"><div class="card-head"><div><p>CONTROLADORES</p><h2>Acessos individuais</h2></div><b id="controller-count">0</b></div><form id="controller-form" class="admin-form"><label>Código<input id="cco-code" placeholder="GAMA02" required></label><label>Nome<input id="cco-name" required></label><label class="wide">PIN novo <input id="cco-pin" type="password" inputmode="numeric" placeholder="Obrigatório no primeiro cadastro"></label><button>SALVAR CONTROLADOR</button></form><div id="controllers" class="admin-list"></div></article></div></section></main><script type="module" src="app.js?v=20260811-1"></script></body></html>
