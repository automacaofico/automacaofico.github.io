<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FICO · Análise Técnica de Propostas — Pacote 11</title>
<style>
:root{
  --fico:#2876B9; --fico-deep:#10578F; --fico-dark:#0B3D66; --laranja:#F6A01A;
  --ink:#123247; --muted:#5A7180; --line:#D8E3E9; --paper:#F4F8FA; --surface:#fff; --soft:#EDF4F7;
  --ok:#14785C; --warn:#9B6202; --risk:#AB423C; --neutro:#8296A2;
  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:48px;
  --r-sm:4px; --r-md:8px; --r-lg:14px; --nav:252px;
  --sh:0 1px 2px rgba(16,87,143,.06),0 6px 18px rgba(16,87,143,.07);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:Aptos,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3{font-family:"Aptos Display",Aptos,"Segoe UI",sans-serif;letter-spacing:-.02em;margin:0}
a{color:var(--fico-deep)}
.app{display:grid;grid-template-columns:var(--nav) 1fr;min-height:100vh}

/* ---------- navegação ---------- */
aside{background:var(--fico-deep);color:#fff;padding:26px 16px 20px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh}
.brand img{width:132px;display:block}
.brand p{margin:12px 0 0;color:#B9DCF2;font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.nav{display:grid;gap:3px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:var(--r-sm);color:#CFE6F4;font-weight:600;font-size:13.5px;transition:background .15s,color .15s}
.nav button:hover{background:#1A6AA6;color:#fff}
.nav button.on{background:var(--fico);color:#fff}
.nav .n{width:20px;font-size:10px;font-weight:800;color:#7FB8DE}
.nav button.on .n{color:var(--laranja)}
.side-foot{margin-top:auto;border-top:1px solid #2E7CB5;padding-top:14px;color:#AECFE6;font-size:11px;line-height:1.5}
.side-foot b{display:block;color:#fff;font-size:12px;margin-bottom:3px}

/* ---------- estrutura ---------- */
main{min-width:0}
.top{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 34px;display:flex;justify-content:space-between;align-items:center;gap:20px;position:sticky;top:0;z-index:5}
.crumb{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.crumb b{color:var(--fico-deep)}
.selo{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:100px;padding:6px 14px;font-size:11.5px;font-weight:700;color:var(--fico-deep)}
.selo i{width:7px;height:7px;border-radius:50%;background:var(--laranja);display:block}
.page{padding:34px;max-width:1560px;margin:0 auto}
.head{margin-bottom:var(--s4);max-width:900px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fico);font-weight:800;margin:0 0 8px}
.head h1{font-size:31px;line-height:1.12}
.head p{color:var(--muted);margin:10px 0 0;font-size:15px}
.screen{display:none}.screen.on{display:block;animation:in .2s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh)}
.pad{padding:22px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:var(--s5) 0 var(--s2)}
.sec:first-child{margin-top:0}
.sec h2{font-size:18px}
.sec span{font-size:12px;color:var(--muted)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}

/* ---------- tabela ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;background:var(--soft);color:#456575;text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;padding:10px 12px;font-weight:800;white-space:nowrap;position:sticky;top:0}
td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:#FAFCFD}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.wrap{overflow-x:auto;border-radius:var(--r-md)}

/* ---------- etiquetas ---------- */
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:100px;padding:3px 9px;font-size:10.5px;font-weight:800;background:var(--soft);color:#456575;white-space:nowrap}
.tag i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block;flex:none}
.tag.ok{background:#E4F3ED;color:var(--ok)}
.tag.warn{background:#FDF2DC;color:var(--warn)}
.tag.risk{background:#FAE9E7;color:var(--risk)}
.tag.neu{background:#EDF1F3;color:var(--neutro)}

/* ---------- ranking ---------- */
.rank{display:grid;gap:10px}
.rk{display:grid;grid-template-columns:36px 1fr 128px 74px;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:var(--r-md);transition:box-shadow .15s,transform .15s}
.rk:hover{box-shadow:var(--sh);transform:translateX(2px)}
.rk .pos{font-family:"Aptos Display",Aptos,sans-serif;font-size:20px;font-weight:800;color:var(--c);text-align:center}
.rk .nm{font-weight:800;font-size:15px}
.rk .rz{color:var(--muted);font-size:11.5px;font-weight:400}
.rk .bar{height:8px;background:#E9EFF3;border-radius:100px;overflow:hidden}
.rk .bar i{display:block;height:100%;background:var(--c);border-radius:100px;transition:width .45s cubic-bezier(.4,0,.2,1)}
.rk .sc{font-family:"Aptos Display",Aptos,sans-serif;font-size:23px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.rk.lider{background:linear-gradient(100deg,#F7FBFD,#fff)}

/* ---------- pesos ---------- */
.pesos{display:grid;gap:14px}
.peso{display:grid;grid-template-columns:210px 1fr 52px;align-items:center;gap:14px}
.peso label{font-size:13px;font-weight:700}
.peso output{font-variant-numeric:tabular-nums;font-weight:800;color:var(--fico-deep);text-align:right;font-size:13px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:100px;background:#DDE7ED;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:var(--fico-deep);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.28);cursor:pointer}
input[type=range]:focus-visible{outline:3px solid var(--laranja);outline-offset:3px}
.presets{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px}
.chip{border:1px solid var(--line);background:#fff;border-radius:100px;padding:6px 13px;font-size:11.5px;font-weight:700;color:var(--fico-deep);transition:.15s}
.chip:hover{border-color:var(--fico);background:#F2F8FC}
.chip.on{background:var(--fico-deep);color:#fff;border-color:var(--fico-deep)}

/* ---------- métricas ---------- */
.kpi{padding:16px 18px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.kpi span{display:block;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.kpi strong{display:block;font-family:"Aptos Display",Aptos,sans-serif;font-size:27px;line-height:1.15;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:11.5px;color:var(--muted)}
.kpi b{font-size:11.5px;color:var(--laranja-esc,#9B6202);font-weight:700}

/* ---------- matriz ---------- */
.mx td:first-child{font-weight:700}
.nota{display:inline-flex;align-items:center;justify-content:center;min-width:46px;padding:4px 8px;border-radius:var(--r-sm);font-weight:800;font-variant-numeric:tabular-nums;font-size:13px}
.n-alto{background:#E4F3ED;color:var(--ok)}
.n-medio{background:#FDF2DC;color:var(--warn)}
.n-baixo{background:#FAE9E7;color:var(--risk)}

/* ---------- gráfico ---------- */
.legenda{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.legenda i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legenda span{font-size:12px;font-weight:700;color:#3E5967}
svg{display:block;max-width:100%;height:auto;overflow:visible}
.gx{font-size:9.5px;fill:var(--muted)}
.gy{font-size:9.5px;fill:var(--muted)}
.grid-l{stroke:#E8EEF2;stroke-width:1}

/* ---------- detalhe ---------- */
.dim{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.dim>summary{padding:14px 18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:14px;font-weight:700;list-style:none;background:var(--soft)}
.dim>summary::-webkit-details-marker{display:none}
.dim>summary::after{content:"▾";color:var(--muted);font-size:12px;transition:.2s}
.dim[open]>summary::after{transform:rotate(180deg)}
.dim .body{padding:16px 18px;border-top:1px solid var(--line)}
.ind{display:grid;grid-template-columns:1fr auto;gap:6px 18px;font-size:13px}
.ind dt{color:var(--muted)}
.ind dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.pen{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:grid;gap:5px}
.pen div{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--risk)}
.pen b{font-variant-numeric:tabular-nums}

.aviso{background:#FFF8E9;border:1px solid #F0DCB0;border-left:4px solid var(--laranja);border-radius:var(--r-md);padding:16px 18px;font-size:13.5px}
.aviso b{display:block;margin-bottom:4px;color:#7A4E02}
.destaque{background:linear-gradient(115deg,var(--fico-deep),var(--fico));color:#fff;border-radius:var(--r-lg);padding:28px 30px;position:relative;overflow:hidden}
.destaque:after{content:"";position:absolute;width:250px;height:250px;border:34px solid rgba(255,255,255,.07);border-radius:50%;right:-90px;bottom:-130px}
.destaque h2{font-size:22px;margin-bottom:8px;position:relative;z-index:1}
.destaque p{margin:0;color:#DCEFFA;max-width:640px;position:relative;z-index:1;font-size:14px}
.destaque .pill{display:inline-block;background:rgba(255,255,255,.16);border-radius:100px;padding:4px 12px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;position:relative;z-index:1}

.lista{display:grid;gap:9px}
.item{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:13px 16px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);font-size:13.5px}
.item .cod{font-weight:800;color:var(--fico-deep);font-size:12px;min-width:52px}
.item p{margin:3px 0 0;color:var(--muted);font-size:12.5px}

.mono{font-family:Consolas,"SF Mono",monospace;font-size:12px}
.filtros{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.vazio{padding:28px;text-align:center;color:var(--muted);font-size:13.5px}
.mob{display:none}
@media(max-width:1120px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}
@media(max-width:900px){
  :root{--nav:0px}
  .app{grid-template-columns:1fr}
  aside{display:none}
  .page{padding:20px 16px 96px}
  .g2,.g4{grid-template-columns:1fr}
  .top{padding:12px 16px}
  .head h1{font-size:25px}
  .rk{grid-template-columns:30px 1fr 64px;gap:10px}
  .rk .bar{display:none}
  .peso{grid-template-columns:1fr;gap:5px}
  .peso output{text-align:left}
  .mob{display:grid;position:fixed;bottom:0;left:0;right:0;z-index:20;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(16,87,143,.09)}
  .mob button{font-size:10px;font-weight:700;color:var(--muted);padding:8px 2px;min-height:46px;border-radius:var(--r-sm)}
  .mob button.on{color:var(--fico-deep);background:var(--soft)}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media print{aside,.top,.mob,.pesos,.presets{display:none}.app{grid-template-columns:1fr}.screen{display:block!important}}
.fico-auth-gate{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;padding:24px;background:#0b3d66;color:#123247;font-family:Aptos,"Segoe UI",system-ui,sans-serif}.fico-auth-gate[hidden]{display:none!important}.fico-auth-card{width:min(420px,100%);padding:30px;border-radius:14px;background:#fff;box-shadow:0 28px 80px rgba(0,0,0,.3)}.fico-auth-card h1{margin:0 0 8px;font-size:26px;color:#0b3d66}.fico-auth-card>p{margin:0 0 22px;color:#5a7180}.fico-auth-card label{display:grid;gap:7px;font-weight:700}.fico-auth-card input[type=password]{width:100%;padding:12px 13px;border:1px solid #c8d7df;border-radius:8px;font:inherit}.fico-auth-card button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:8px;background:#2876b9;color:#fff;font:700 15px inherit;cursor:pointer}.fico-auth-card button:disabled{opacity:.65}.fico-auth-remember{grid-template-columns:auto 1fr!important;align-items:center;margin-top:13px;font-size:13px}.fico-auth-remember input{margin:0}.fico-auth-hint{margin-top:16px;color:#5a7180;font-size:13px}.fico-auth-hint summary{cursor:pointer;font-weight:700;color:#2876b9}.fico-auth-hint p{margin:7px 0 0}.fico-auth-error{min-height:20px;margin-top:10px;color:#ab423c;font-size:13px;font-weight:700}
</style>
</head>
<body>
<div class="fico-auth-gate" id="ficoAccessGate"><form class="fico-auth-card" id="ficoAccessForm"><h1>Pacote 11</h1><p>Acesso restrito à equipe de contratação FICO.</p><label>Senha de acesso<input id="ficoAccessPassword" type="password" autocomplete="current-password" required></label><label class="fico-auth-remember"><input id="ficoRememberAccess" type="checkbox">Lembrar acesso neste dispositivo</label><button type="submit">Acessar análise</button><div class="fico-auth-error" id="ficoAccessError" role="alert"></div><details class="fico-auth-hint"><summary>Relembrar senha</summary><p>Contrato + números dos pacotes, sem espaços.</p></details></form></div>
<div class="app">
  <aside>
    <div class="brand">
      <img id="logo" alt="FICO — Ferrovia de Integração Centro-Oeste">
      <p>Análise técnica</p>
    </div>
    <nav class="nav" id="nav" aria-label="Navegação principal"></nav>
    <div class="side-foot">
      <b>Avaliação técnica</b>
      Nenhum dado comercial considerado. Preços removidos na origem.
    </div>
  </aside>

  <main>
    <header class="top">
      <div class="crumb">FICO / Contratação de obras / <b>Pacote 11</b></div>
      <div class="selo"><i></i><span id="selo">5 proponentes · 1ª rodada</span></div>
    </header>
    <div id="telas"></div>
  </main>
</div>

desc":"A abertura e a manutenção dos acessos necessários à execução da obra são d e responsabilidade da ATERPA, conforme estabelecido na documentação técnica disponibilizada pela VALE. Nesse sentido, estamos considerando a mobilização de equipamentos para abertura de acessos pelo período de 3 (três) meses, no início do contrato, além de equipamentos para manutenção dos acessos identificados ao longo de todo o período de execução da obra. Caso, no decorrer da execução contratual, seja necessária a abertura de novos acessos não identificados ou não previstos nesta proposta, tal atividade s erá tratada "},{"ref":"","tipo":"desvio","tema":"Prazo e licenças","desc":"Não estamos considerando o fornecimento do material de forro para os acessos, ficando este material sob responsabilidade de fornecimento pela VALE, cabendo à ATERPA apenas a mobilização de equipamentos para sua aplicação;"},{"ref":"","tipo":"desvio","tema":"Preço e reajuste","desc":"Não estamos considerando perdas de produtividade, paralisações ou quaisquer impactos decorrentes de interferências relacionadas às comunidades indígenas. Caso tais ocorrências v enham a impactar a execução dos serviços, seus efeitos sobre prazo, custos e produtividade deverão ser objeto de avaliação e consenso entre as partes, visando ao reequilíbrio contratual, quando aplicável ;"},{"ref":"","tipo":"desvio","tema":"Prazo e licenças","desc":"Estamos considerando que a VALE será responsável pelo afugentamento de fauna e flora; Clicksign ab4519a4-02cf-4e8c-b1da-81740bf2e770"},{"ref":"","tipo":"desvio","tema":"Prazo e licenças","desc":"Entendemos que o consumo de óleo diesel considerado nesta proposta foi estimado com base no cronograma físico e nos quantitativos vigentes na data desta proposta, sendo diretamente proporcional às horas de operação dos e quipamentos previstos. Dessa forma, quaisquer replanejamentos do cronograma ou variações nos quantitativos ao longo da execução contratual deverão implicar o ajuste proporcional do consumo de óleo diesel e do respectivo custo, a ser revisto periodicamente em conjunto com a VALE ;"},{"ref":"","tipo":"desvio","tema":"Prazo e licenças","desc":"Para os custos de Administração Local e de Manutenção/Operação de Canteiro de Obras, não está sendo considerado o critério de medição por verba vinculada ao avanço financeiro acumulado da obra, estabelecido nos respectivos itens da documentação técnica [8.3 – CMS C.01.10.005 e 8.2 – CMS C.05.05.020]. Isso porque esses custos são predominantemente vinculados ao prazo de execução da obra, e não ao ritmo de avanço físico-financeiro, o que gera descolamento entre custo incorrido e receita medida, especialmente em eventuais atrasos não imputáveis à ATERPA. Em nossa proposta comercial, é apresentada"},{"ref":"","tipo":"desvio","tema":"Prazo e licenças","desc":"Para os serviços de escavação, carga, transporte, descarga e espalhamento de solo, estamos considerando que não haverá retenção e que o critério de medição item 11.7.1 [CMS C.25.50.000] deverá ser revisado."},{"ref":"","tipo":"desvio","tema":"Prazo e licenças","desc":"Constatamos que diversos critérios de medição da documentação técnica preveem retenção de 10% do valor da verba do respectivo item, condicionada ao atendimento de exigências específicas de cada item (ex.: correção de pendências, conclusão de drenagem, pendências ambientais, recomposição ambiental, entre Clicksign ab4519a4-02cf-4e8c-b1da-81740bf2e770 outras). Para todos esses itens, estamos considerando que não haverá retenção e que os critérios de medição deverão ser revisados."},{"ref":"","tipo":"desvio","tema":"Prazo e licenças","desc":"Não estamos considerando aproveitamento de estrutura de canteiro, ao final do contrato, uma vez que a Requisição técnica prevê a possibilidade de a VALE, caso queira, possa ficar com a instalação;"},{"ref":"","tipo":"desvio","tema":"Prazo e licenças","desc":"A VALE será responsável pela remoção das interferências elétricas na área da obra, cuja conclusão é esperada antes do início dos serviços contratados. Caso isso não ocorra e haja impacto em prazo, custo ou produtividade, tal impacto deverá ser tratado em conjunto com a VALE ;"},{"ref":"","tipo":"desvio","tema":"Prazo e licenças","desc":"Para as atividades relativas às instalações do canteiro industrial, considera mos a utilização de grupos geradores como fonte de suprimento de energia e létrica para todas as atividades inerentes ao presente contrato, não estando prevista, portanto, a utilização de energia fornecida pela Concessionária de energia do estado ;"},{"ref":"","tipo":"desvio","tema":"Prazo e licenças","desc":"Como previsto na Requisição Técnica, que “A CONTRATADA será responsável pela execução do Plano de Recuperação de Áreas Degradadas na faixa de domínio, devendo apresentar o plano desenvolvido para aprovação pela VALE, para posterior execução”. Diante da colocação acima, entendemos sim que será de nossa responsabilidade e que apresentaremo s o Plano em momento oportuno, caso contratados. Os serviços a serem executados, seus respectivos quantitativos e custos, serão tratados futuramente, em fase de contrato em andamento. Clicksign ab4519a4-02cf-4e8c-b1da-81740bf2e770 21_Lista_Desvios_Premissas_Re"}]},"Empa/TDEC":{"total":8,"desvios":8,"premissas":0,"porTema":{"Prazo e licenças":5,"Preço e reajuste":3},"lista":[{"ref":"LICENCIAMENTO E CONDICIONANTES","tipo":"desvio","tema":"Prazo e licenças","desc":"Consideramos que todos os licenciamentos necessários a implantação do projeto, supressão vegetal, operação, logística, metodologias praticadas são de responsabilidade da VALE. Não consideramos quaisquer custos e prazos para desapropriações e despesas decorrentes do licenciamentos ambientais do empreendimento (LI e ASV’s) e de quaisquer outros licenciamentos e autorizações que se fizerem necessárias, exceto as licenças indicada na Matriz de Responsabilidades como de competência da Contratada, como Canteiros de Obras Principal, Usinas de Concreto, etc."},{"ref":"CENÁRIO HIDROLÓGICO","tipo":"desvio","tema":"Preço e reajuste","desc":"O planejamento e o preço do empreendimento foram elaborados com base nos dados constantes no Processo de Concurso, nossa Proposta Técnica e a documentação associada, bem como das complementaridades e esclarecimentos subsequentes enviados pela Vale. Caso ocorra situação atípica, em termos de pluviometria, reportada aos dados constantes na nossa proposta, ou seja, períodos de chuvas com precipitações acima do histórico, em até 10%, resultando em menor número de dias trabalháveis do que os indicados em nossa Proposta Técnica, os impactos em prazo e custos (diretos e indiretos) serão analisados e "},{"ref":"PARALISAÇÕES","tipo":"desvio","tema":"Preço e reajuste","desc":"Caso ocorra alguma paralisação na frente de obra decorrente de órgãos externos, influência da comunidade local, fatores geológicos e geotécnicos das estruturas, ou qualquer outro motivo fora aquelas apresentadas na Proposta Técnica, que não seja de responsabilidade da Contratada, propomos que seja registrado no RDO todos recursos paralisados para a devida negociação e remuneração das equipes paradas, com base nos detalhamentos de preços constantes da Proposta Comercial, sendo os impactos em prazo analisados e discutidos junto a VALE."},{"ref":"INTERFERÊNCIAS","tipo":"desvio","tema":"Preço e reajuste","desc":"A presente proposta não considera a gestão, remoção e relocação de interferências não mapeadas. Durante as operações da TDEC no site do empreendimento e áreas afetadas, caso ocorra a surgência de alguma interferência não mapeada, incluindo sitíos arqueológicos, assentamentos rurais, objetos e estruturas enterradas, redes elétricas e hidráulicas, etc. propomos que seja registrado no RDO todos recursos paralisados para a devida negociação e remuneração das equipes paradas, com base nos detalhamentos de preços constantes da Proposta Comercial, sendo os impactos em prazo analisados e discutidos. A"},{"ref":"ADMINISTRAÇÃO LOCAL","tipo":"desvio","tema":"Prazo e licenças","desc":"Devido a complexidade das intervenções que serão realizadas e a possibilidade da ocorrência de atrasos por motivos alheios a atuação da TDEC, como alterações de escopo, condições locais e de quantidades, entendemos ser essencial a medição da administração local em formato diferente. Dessa forma, a presente proposta é apresentada considerando alteração do modelo de remuneração da Administração Local, onde medição da verba proposta para a administração local será em parcelas fixas mensais.Onde: \"Os serviços de administração local (administração, gerenciamento, topografia, controle tecnológico, l"},{"ref":"SEGUROS","tipo":"desvio","tema":"Prazo e licenças","desc":"A presente proposta contempla exclusivamente a cobertura na modalidade Seguro Garantia, limitada ao percentual estabelecido na RT do processo. Assim, quaisquer outros seguros ou coberturas adicionais (Seguro de Responsabilidade Civil, Seguro de Riscos de Engenharia, etc) que eventualmente se façam necessários serão de responsabilidade da Vale e abrangerão a atuação da TDEC, sem geração de ônus à contratada. FERROVIA DE INTEGRAÇÃO DO CENTRO-OESTE – FICO – LOTE 11 - VALE LISTA DE DESVIOS E CONSIDERAÇÕES LISTA DE DESVIOS E CONSIDERAÇÕES FERROVIA DE INTEGRAÇÃO DO CENTRO-OESTE – FICO – LOTE 11 - VA"},{"ref":"AGULHAMENTO DE MATERIAL","tipo":"desvio","tema":"Prazo e licenças","desc":"Os volumes de aterro e aplicação de material granular seguem os quantitativos da planilha VALE, dessa forma, não contempla possíveis sobreconsumos com agulhamento de material no momento da aplicação (ocorrências para caso de subleitos e solos compressíveis). Caso o consumo destes materiais de aterro e agregados seja maior que o previsto, tendo como consequência maior demanda de aquisição, carga, transporte, espalhamento de material e compactação, a TDEC entende que esses impactos devem ser objeto de alinhamento entre as partes."},{"ref":"SOLOS PARA ATERROS","tipo":"desvio","tema":"Prazo e licenças","desc":"O presente orçamento não contempla a aquisição de solos para execução de aterros e demais aplicações que demandem o uso de solo. Assim, esta proposta considera que todos os solos de aterro utilizados na obra serão integralmente provenientes das escavações obrigatórias previstas nas áreas de empréstimo lateral. Adicionalmente, considera-se que todos os solos destinados a essas finalidades apresentarão competência e qualidade adequadas às respectivas aplicações, isto é, no momento em que forem escavados. Dessa forma, caso os solos locais não apresentem as caracterisiticas necessárias para sua ap"}]},"Fidens":{"total":29,"desvios":9,"premissas":20,"porTema":{"Prazo e licenças":22,"Preço e reajuste":6,"Outros":1},"lista":[{"ref":"CM-1500FE-B-500002_REV0_19.06.26 CMS C.25.30.000","tipo":"desvio","tema":"Prazo e licenças","desc":"A presente proposta considera que os momentos extraordinários de transporte serão medidos de forma objetiva, considerando o volume transportado \"m³\" multiplicado pela distância média de transporte - DMT \"km\" (m³xkm). A DMT será aferida através dos dados do sistema de telemetria \"Controle de Frota\", que determinará a distância percorrida pelo equipamento transportador, quando carregado, descontando a distância considerada no item de serviço a que se refere. Portanto, após validação e aprovação do sistema de telemetria da FIDENS pela VALE, entendemos que não há necessidade de prévia autorização "},{"ref":"CM-1500FE-B-500002_REV0_19.06.26 Geral p/ Terraplenagem","tipo":"desvio","tema":"Prazo e licenças","desc":"Os CMS's de terraplenagem preveem a retenção de 10% da medição do item vinculado à conclusão da drenagem no respectivo trecho. Esta condição gera um descasameto do fluxo financeiro da obra com o real realizado que além de impactar na medição dos serviços de terraplenagem gera impacto também da medição do item de Admnistração Local que, conforme respectivo CMS, está vinculado ao avanço físico financeiro da obra. Diante disto, entende-se que há uma duplicidade no impacto ao fluco financeiro da obra, gerando um impacto negativo desproporcional na medição do escopo. No intuito de aplicarmos boas p"},{"ref":"","tipo":"premissa","tema":"Preço e reajuste","desc":"Apresentam-se na tabela abaixo as densidades adotadas para os materiais do projeto. Essa definição fundamenta-se na análise dos documentos RL-1500FE-X-500003, RL-1523FE-X-500020 e RL-1522FE-X-500031. Reiteramos que os documentos em questão não correlacionam de forma objetiva as densidades às respectivas caracterizações de 1ª, 2ª e 3ª Categorias conforme apresentado nos itens de PQ. Portanto, as densidades abaixo foram definidas usando de base o documento da VALE, demodos que estas informações devem ser validadas pela VALE. Caso durante a execução das obras sejam identificadas variações destas "},{"ref":"","tipo":"premissa","tema":"Preço e reajuste","desc":"A presente proposta foi elaborada considerando os Quadros de Distribuição de Terraplenagem (QDT) e os quantitativos disponibilizados pela Contratante. Caso sejam verificadas, durante a execução, divergências entre as características geotécnicas dos materiais ou entre as densidades efetivamente obtidas em campo e aquelas consideradas para elaboração do projeto e do balanço de massas, que impliquem alteração dos volumes movimentados, distâncias médias de transporte ou necessidade de áreas adicionais de empréstimo ou bota-fora, os respectivos impactos deverão ser objeto de reavaliação e reequilíb"},{"ref":"CM-1500FE-B-500002_REV0_19.06.26 CMS C.05.05.020","tipo":"desvio","tema":"Prazo e licenças","desc":"A presente Proposta considera que a medição da manutenção de canteiro se dará através de verba mensal fixa mensal obtida do valor total da menutenção de canteiro dividida pelo prazo elegível para recebimento desta verba, que exclui o prazo de construção do canteiro e o prazo de desmobilização."},{"ref":"RT-1500FE-B-500002_REV0_19.06.26 \"PRAZ DE EXECUÇÃO E MARCOS CONTRATUAIS\" - Pág. 66/129","tipo":"desvio","tema":"Prazo e licenças","desc":"A presente proposta considera que a execução da obra se dará em 2 anos, conforme previsto em RT, porém a Construção do Canteiro/Alojamento se dará em 1 ano, ou seja com a O.S. em 14/01/20227, até o final do período chuvoso a FIDENS fará a Construção do canteiro de obras e do alojamento, fará a instalação da ETE/ETA, Central de Concreto, dentre outras estruturas necessárias. Neste período será providenciada toda e qualques licença, Alvará, Outorga, que se fizer necessária para as dependencias do canteiro de obras e alojamentos, incluindo os canteiros avançados. Em Mar/2008 se dará o início efet"},{"ref":"","tipo":"premissa","tema":"Prazo e licenças","desc":"A FIDENS informa que não foram considerados, na presente proposta técnico-comercial, impactos decorrentes de alteração legislativa relacionada à aprovação da PEC nº 8/2025 em tramitação no Congresso referente à jornada máxima semanal de trabalho em regime de escala 6x1. Não consideramos qualquer impacto em ampliação de dias de descanso semanal remunerado ou a qualquer outra modificação legal, constitucional, normativa ou convencional que venha a ser criado após a assinatura deste contrato e altere as condições atualmente aplicáveis ao dimensionamento e remuneração de mão de obra. O dimensionam"},{"ref":"","tipo":"premissa","tema":"Preço e reajuste","desc":"A presente proposta não contempla quaisquer impactos decorrentes da implementação da Reforma Tributária ou de alterações supervenientes na legislação tributária, fiscal, previdenciária ou trabalhista. Dessa forma, a criação de novos tributos, alteração de alíquotas, bases de cálculo, benefícios fiscais, interpretações legais ou quaisquer mudanças que impliquem aumento ou redução dos encargos incidentes sobre a execução contratual ensejarão a imediata revisão dos preços contratuais, visando à manutenção do equilíbrio econômico-financeiro do contrato, nos termos da legislação aplicável."},{"ref":"CM-1500FE-B-500002_REV0_19.06.26 CMS C.01.05.000 MOBILIZAÇÃO DE PESSOAL E EQUIPAMENTOS","tipo":"desvio","tema":"Prazo e licenças","desc":"O CMS C.01.05.000 estabelece que 45% da verba será medida apenas no segundo ano de obra obra tendo em vista que este percentual está vinculado à mobilização de 100% do efetivo pico, que ocorre apenas a partir do segundo ano de obra, tendo em vista que o primeiro ano da obra será destinado às obras de construção do alojamento e canteiro principal, enquanto o escopo será executado nos 2 anos posteriores. Deste modo, tendo em vista que os custos de mobilização são incorridos majoritariamente no início do contrato, este critério é demasiado lesivo ao fluxo econômico do contrato. Potranto, a FIDENS"},{"ref":"CM-1500FE-B-500002_REV0_19.06.26 CMS C.01.05.010 MOBILIZAÇÃO E DESMOBILIZAÇÃO DE PESSOAL E","tipo":"desvio","tema":"Prazo e licenças","desc":"O CMS C.01.05.000 estabelece que 50% da verba será medida apenas no segundo ano de obra obra tendo em vista que este percentual está vinculado à mobilização de 100% do efetivo pico, que ocorre apenas a partir do segundo ano de obra, tendo em vista que o primeiro ano da obra será destinado às obras de construção do alojamento e canteiro principal, enquanto o escopo será executado nos 2 anos posteriores. Deste modo, tendo em vista que os custos de mobilização são incorridos majoritariamente no início do contrato, este critério é demasiado lesivo ao fluxo econômico do contrato. Potranto, a FIDENS"},{"ref":"","tipo":"premissa","tema":"Prazo e licenças","desc":"Não faz parte deste escopo os serviços de execução de Plano de Chuva nas janelas de inverno, de modo que caso seja necessário alguma atividade de proteção e manutenção durante o período chuvoso estes serviços serão medidos nos respectivos itens de PQ da planilha."},{"ref":"CM-1500FE-B-500002_REV0_19.06.26 CMS C.05.05.020 MANUTENÇÃO E OPERAÇÃO DE CANTEIRO DE OBRA","tipo":"desvio","tema":"Prazo e licenças","desc":"A medição integral deste CMS está vinculada à avaliação dos itens da Lista de Verificação de Manutenção de Canteiros (ANEXO A) e Lista de Verificação de Plano de Chuva (ANEXO P). A FIDENS informa que não recebeu tais documentos e, portanto, não consideramos qualquer efeito de glosa atrelado ao respectivo CMS. Diante disto, consideramos que esta verba será medida integralmente pelo período de manutenção dos canteiros, descontando-se os prazos de mobilização e desmobilização do contrato."},{"ref":"CM-1500FE-B-500002_REV0_19.06.26 CMS C.01.10.005 AMNISTRAÇÃO LOCAL","tipo":"premissa","tema":"Prazo e licenças","desc":"A FIDENS está de acordo com o critério de medição vinculado ao avanço físico financeiro da obra. Reiteramos que esta verba deverá ser medida integralmente até o final do contrato, quando concluído o escopo de execução dos serviços do contrato, sem previsão de glosas ou carência de medição neste período. Além disto, conforme destacado pela VALE esta verba mensal poderá ser menor do que o previsto contratualmente em caso de não aderência ao avanço financeiro total mas do mesmo modo poderá ser medida a maior considerando antecipação do avanço financeiro do escopo. Ademais, conforme reiterado em c"},{"ref":"RT-1500FE-B-500002","tipo":"premissa","tema":"Prazo e licenças","desc":"Como proposta de otimização metodológica, a FIDENS considerou a segmentação da viga metálica principal em três módulos para transporte e montagem, em substituição ao içamento da estrutura em peça única. A metodologia visa reduzir a necessidade de mobilização de guindaste da classe de aproximadamente 300 toneladas, mantendo o desempenho estrutural após a execução das soldas de campo, estando sua aplicação condicionada à aprovação da VALE e do projetista responsável."},{"ref":"RT-1500FE-B-500002","tipo":"premissa","tema":"Prazo e licenças","desc":"O cronograma executivo foi elaborado considerando a disponibilidade contínua das frentes de serviço, das áreas de apoio e dos acessos previstos na documentação técnica da licitação, pressupondo a inexistência de interferências com terceiros, desapropriações pendentes ou restrições de acesso não identificadas na documentação contratual, bem como a disponibilização contínua das licenças, interfaces operacionais e demais liberações necessárias à execução dos serviços."},{"ref":"RT-1500FE-B-500002","tipo":"desvio","tema":"Preço e reajuste","desc":"Na RT RT-1500FE-B-500002, pagina 23 cita: \"Caso haja quaisquer alterações na distribuição dos materiais de terraplenagem (QDT - Quadros de Distribuição de Terraplenagem), por responsabilidade da CONTRATADA, e que venham a promover o desequilíbrio de massas, a área de ADME ou de Empréstimo deverá ser definida pela CONTRATADA, em conformidade com ADA - Área Diretamente Afetada e a LI, e deverá ser apresentada para a aprovação da VALE.\" O planejamento de movimentação de materiais foi elaborado com base nos projetos e Quadros de Distribuição de Terraplenagem (QDTs) disponibilizados pela VALE. Even"},{"ref":"RT-1500FE-B-500002","tipo":"premissa","tema":"Preço e reajuste","desc":"O cronograma e as produtividades foram dimensionados considerando as condições climáticas apresentadas no capítulo 6-Praticabilidade da Proposta Técnica, compatíveis com a região de implantação do empreendimento. Ocorrências excepcionais de chuvas que comprometam o avanço físico dos serviços irão demandar reavaliação do planejamento e repactuação dos preços e prazos propostos."},{"ref":"RT-1500FE-B-500002","tipo":"premissa","tema":"Outros","desc":"As metodologias executivas apresentadas nesta proposta, incluindo Plano de Rigging, Plano de Segurança e Vigilância, logística de mobilização e estratégias construtivas, possuem caráter propositivo e deverão ser submetidas à análise e aprovação da VALE antes de sua implementação."},{"ref":"RT-1500FE-B-500002","tipo":"premissa","tema":"Prazo e licenças","desc":"A presente proposta considera a conferência do levantamento topográfico primitivo antes do início das atividades, conforme previsto na RT. Eventuais divergências entre a topografia de projeto e as condições efetivamente verificadas em campo que impliquem alterações de quantitativos, soluções executivas ou prazos deverão ser objeto de avaliação e repactuação contratual entre as partes."},{"ref":"RT-1500FE-B-500002","tipo":"premissa","tema":"Prazo e licenças","desc":"A proposta considera a implantação de plataformas operacionais, áreas de armazenamento das vigas metálicas, caminhos de serviço e demais estruturas provisórias necessárias à execução da metodologia de montagem proposta, conforme previsto na RT, estando sua configuração definitiva condicionada à aprovação da VALE."},{"ref":"RT-1500FE-B-500002","tipo":"premissa","tema":"Preço e reajuste","desc":"A presente proposta foi elaborada considerando a utilização das áreas de empréstimo, ADMEs e demais áreas disponibilizadas e aprovadas pela VALE. Caso a evolução dos projetos executivos, alterações de projeto ou condições executivas demandem a implantação de novas áreas ou a ampliação das existentes, os respectivos impactos em licenciamento, custos, recursos e prazos deverão ser objeto de análise e reequilíbrio contratual entre as partes."},{"ref":"RT-1500FE-B-500002","tipo":"premissa","tema":"Prazo e licenças","desc":"O aterro em rocha foi considerado exclusivamente nos locais indicados nos projetos fornecidos pela VALE. A escavação em terceira categoria é considerada atividade predecessora para a execução dos aterros em solos de baixa resistência. Dessa forma, a identificação de novas ocorrências de solos de baixa resistência poderá demandar serviços adicionais de escavação em terceira categoria, impactando o planejamento, o cronograma e as demais atividades da obra. Os impactos decorrentes dessa condição, incluindo custos, quantitativos e prazos, deverão ser objeto de avaliação e repactuação contratual en"},{"ref":"RT-1500FE-B-500002","tipo":"premissa","tema":"Prazo e licenças","desc":"A presente proposta considera exclusivamente os materiais, serviços e quantitativos previstos na Planilha de Quantidades (PQ-1500FE-B-500002_REV0_19.06.26) fornecida pela VALE. A eventual necessidade de execução de itens não previstos, bem como de quantitativos superiores aos constantes na PQ-1500FE-B-500002_REV0_19.06.26, caracterizará alteração de escopo, estando os respectivos custos e prazos sujeitos à negociação e repactuação contratual entre as partes."},{"ref":"RT-1500FE-B-500002","tipo":"premissa","tema":"Prazo e licenças","desc":"A presente proposta foi elaborada com base nas condições geológicas, geotécnicas e no balanço de massas disponibilizados pela VALE. Caso as condições verificadas in situ apresentem divergências em relação às informações fornecidas, alterando a classificação dos materiais, os volumes de corte e aterro, o balanço de massas e, consequentemente, as Distâncias Médias de Transporte (DMT) efetivamente executadas, poderão ocorrer impactos nos quantitativos, nas produtividades, na metodologia executiva, nos critérios de medição, nos custos e nos prazos de execução. Nessa hipótese, os impactos decorrent"},{"ref":"RT-1500FE-B-500002","tipo":"premissa","tema":"Prazo e licenças","desc":"Não foi considerada, na presente proposta, a execução de serviços de escavação, remoção, transporte e destinação de solos moles, inclusive nos locais em que foi prevista a execução de aterro em rachão. Caso, durante a execução da obra, seja constatada a necessidade desses serviços, os impactos decorrentes sobre os quantitativos, a metodologia executiva, os custos e os prazos deverão ser objeto de avaliação e repactuação contratual entre as partes."},{"ref":"RT-1500FE-B-500002","tipo":"premissa","tema":"Prazo e licenças","desc":"O prazo de execução apresentado nesta proposta está diretamente condicionado à disponibilização, pela VALE, das frentes de serviço, áreas de trabalho, acessos, licenças e demais liberações necessárias à execução dos serviços, bem como à análise e aprovação, em prazos compatíveis com o cronograma executivo, dos documentos técnicos, metodologias executivas, planos e projetos submetidos pela Contratada. Eventuais atrasos, restrições ou liberações parciais que impactem o caminho crítico da obra poderão afetar a sequência executiva, a produtividade e o cronograma, devendo os respectivos impactos em"},{"ref":"CM-1500FE-B-500002_REV0_19.06.26 CMS C.25.30.000","tipo":"desvio","tema":"Prazo e licenças","desc":"Embora o critério de medição da VALE ( CM-1500FE-B-500002- CMS C.25.05.005) estabeleça que a escavação de materiais de 1ª categoria possa exigir o uso de escarificador, a presente proposta foi elaborada considerando que os materiais classificados como 1ª categoria serão escavados por meios mecânicos convencionais, sem a utilização de escarificador. Dessa forma, caso seja necessária a utilização contínua ou sistemática de escarificador para a execução de materiais classificados como 1ª categoria, os impactos decorrentes na produtividade, nos custos e nos prazos deverão ser objeto de avaliação e"},{"ref":"RT-1500FE-B-500002","tipo":"premissa","tema":"Prazo e licenças","desc":"A proposta considera a inexistência de interferências não identificadas na documentação técnica da licitação, tais como redes subterrâneas, utilidades, estruturas existentes, passivos ambientais ou condicionantes operacionais não informadas. A identificação dessas interferências durante a execução poderá implicar revisão dos métodos executivos, dos quantitativos, dos recursos mobilizados, dos custos e dos prazos, devendo os respectivos impactos ser objeto de avaliação e repactuação contratual entre as partes."},{"ref":"RT-1500FE-B-500002","tipo":"premissa","tema":"Prazo e licenças","desc":"A presente proposta considera que os projetos, especificações técnicas, memoriais, relatórios, levantamentos e demais documentos disponibilizados pela VALE apresentam compatibilidade entre si. Eventuais divergências, incompatibilidades ou omissões identificadas durante o desenvolvimento da engenharia ou <script>/* FICO — Análise Técnica de Propostas · Pacote 11
   Aplicação local, autocontida. Dados pré-extraídos em dados.js. */

const $ = s => document.querySelector(s);
const D = DADOS;
const PR = D.proponentes;
const DIMS = D.dimensoes;

const fmt = (n, d = 0) => (n === null || n === undefined || !isFinite(n)) ? '—'
  : Number(n).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const classeNota = n => n >= 70 ? 'n-alto' : n >= 50 ? 'n-medio' : 'n-baixo';
const nota = n => `<span class="nota ${classeNota(n)}">${fmt(n, 1)}</span>`;

/* ---------- pesos ---------- */
const PESOS = {};
DIMS.forEach(d => PESOS[d.chave] = d.pesoPadrao);

const PRESETS = {
  'Equilibrado': { conformidade: 20, cpu: 28, prazo: 20, recursos: 17, capacidade: 15 },
  'Foco em prazo': { conformidade: 15, cpu: 20, prazo: 38, recursos: 17, capacidade: 10 },
  'Foco em CPU': { conformidade: 15, cpu: 45, prazo: 15, recursos: 15, capacidade: 10 },
  'Foco em capacidade': { conformidade: 18, cpu: 20, prazo: 15, recursos: 15, capacidade: 32 },
  'Rigor documental': { conformidade: 40, cpu: 25, prazo: 15, recursos: 10, capacidade: 10 },
};
let presetAtivo = 'Equilibrado';

function calcular() {
  const soma = Object.values(PESOS).reduce((a, b) => a + b, 0) || 1;
  return PR.map(p => ({
    ...p,
    total: DIMS.reduce((s, d) => s + p.dimensoes[d.chave].nota * PESOS[d.chave], 0) / soma,
  })).sort((a, b) => b.total - a.total);
}

/* ---------- gráficos (SVG puro) ---------- */
function barrasV(series, labels, cores, alt = 210, unidade = '') {
  const larg = 780, padL = 46, padB = 30, padT = 12;
  const max = Math.max(...series.flat().filter(v => isFinite(v)), 1);
  const nG = labels.length;
  const passo = (larg - padL - 12) / nG;
  const bw = Math.min(passo / (series.length + 1), 26);
  let g = '';
  for (let t = 0; t <= 4; t++) {
    const y = padT + (alt - padT - padB) * (1 - t / 4);
    g += `<line class="grid-l" x1="${padL}" y1="${y}" x2="${larg}" y2="${y}"/>`
      + `<text class="gy" x="${padL - 7}" y="${y + 3}" text-anchor="end">${fmt(max * t / 4)}</text>`;
  }
  series.forEach((serie, si) => {
    serie.forEach((v, i) => {
      if (!isFinite(v)) return;
      const h = (alt - padT - padB) * (v / max);
      const x = padL + i * passo + (passo - bw * series.length) / 2 + si * bw;
      g += `<rect x="${x}" y="${padT + (alt - padT - padB) - h}" width="${bw - 2}" height="${Math.max(h, 0)}" fill="${cores[si]}" rx="2"><title>${esc(labels[i])}: ${fmt(v)} ${unidade}</title></rect>`;
    });
  });
  labels.forEach((l, i) => {
    g += `<text class="gx" x="${padL + i * passo + passo / 2}" y="${alt - padB + 15}" text-anchor="middle">${esc(l)}</text>`;
  });
  return `<svg viewBox="0 0 ${larg} ${alt}" role="img">${g}</svg>`;
}

function linhas(series, cores, nomes, alt = 250) {
  const larg = 820, padL = 44, padB = 28, padT = 12;
  const maxX = Math.max(...series.map(s => s.length), 1);
  const maxY = Math.max(...series.flat().filter(v => isFinite(v)), 1);
  const px = i => padL + (larg - padL - 10) * (i / Math.max(maxX - 1, 1));
  const py = v => padT + (alt - padT - padB) * (1 - v / maxY);
  let g = '';
  for (let t = 0; t <= 4; t++) {
    const y = padT + (alt - padT - padB) * (1 - t / 4);
    g += `<line class="grid-l" x1="${padL}" y1="${y}" x2="${larg}" y2="${y}"/>`
      + `<text class="gy" x="${padL - 7}" y="${y + 3}" text-anchor="end">${fmt(maxY * t / 4)}</text>`;
  }
  for (let m = 0; m < maxX; m += 3) {
    g += `<text class="gx" x="${px(m)}" y="${alt - padB + 15}" text-anchor="middle">${m + 1}</text>`;
  }
  series.forEach((s, si) => {
    if (!s || !s.length) return;
    const d = s.map((v, i) => `${i ? 'L' : 'M'}${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(' ');
    g += `<path d="${d}" fill="none" stroke="${cores[si]}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const iMax = s.indexOf(Math.max(...s));
    g += `<circle cx="${px(iMax)}" cy="${py(s[iMax])}" r="3.6" fill="${cores[si]}"><title>${esc(nomes[si])} — pico ${fmt(s[iMax])} no mês ${iMax + 1}</title></circle>`;
  });
  g += `<text class="gx" x="${larg / 2}" y="${alt - 2}" text-anchor="middle">mês do contrato</text>`;
  return `<svg viewBox="0 0 ${larg} ${alt}" role="img">${g}</svg>`;
}

function radar(p, tam = 220) {
  const c = tam / 2, raio = c - 34, n = DIMS.length;
  const ang = i => (Math.PI * 2 * i / n) - Math.PI / 2;
  let g = '';
  [0.25, 0.5, 0.75, 1].forEach(f => {
    const pts = DIMS.map((_, i) => `${c + Math.cos(ang(i)) * raio * f},${c + Math.sin(ang(i)) * raio * f}`).join(' ');
    g += `<polygon points="${pts}" fill="none" stroke="#E4EBEF" stroke-width="1"/>`;
  });
  const pts = DIMS.map((d, i) => {
    const v = p.dimensoes[d.chave].nota / 100;
    return `${c + Math.cos(ang(i)) * raio * v},${c + Math.sin(ang(i)) * raio * v}`;
  }).join(' ');
  g += `<polygon points="${pts}" fill="${p.cor}22" stroke="${p.cor}" stroke-width="2"/>`;
  DIMS.forEach((d, i) => {
    const x = c + Math.cos(ang(i)) * (raio + 16), y = c + Math.sin(ang(i)) * (raio + 16);
    const a = Math.abs(Math.cos(ang(i))) < 0.3 ? 'middle' : (Math.cos(ang(i)) > 0 ? 'start' : 'end');
    g += `<text class="gx" x="${x}" y="${y + 3}" text-anchor="${a}">${esc(d.nome.split(' ')[0])}</text>`;
  });
  return `<svg viewBox="0 0 ${tam} ${tam}" role="img">${g}</svg>`;
}

    entregar as horas que as composições consomem. A resposta tem limite físico conhecido e não depende de
    nenhuma premissa externa — 1 turno rende ~176 h/mês, 2 turnos ~352, 3 turnos ~528, e o teto absoluto
    de operação contínua é 720 h/mês. Do lado das CPUs entram apenas composições verificadas contra uma
    âncora de comparação; as sem par ficam de fora, porque não há como atestá-las.

/* 6. Risco contratual */

/* 7. Frota e produtividade — explosão máquina a máquina */
T('frota', 'Frota e produtividade', 'Frota', () => {
  const F = A().frotaItem;
  const ordem = ['Aterpa', 'Ápia', 'R&D', 'Empa/TDEC', 'Fidens'];
  const pos = p => p === 'ok' ? '<span class="tag ok"><i></i>dentro da faixa</span>'
    : p === 'lento' ? '<span class="tag risk"><i></i>lento</span>'
      : p === 'otimista' ? '<span class="tag warn"><i></i>otimista</span>' : '<span class="tag neu"><i></i>—</span>';

  return `
  <div class="head">
    <p class="eyebrow">Camada mais profunda</p>
    <h1>Frota máquina a máquina.</h1>
    <p>Nos dois serviços que mais pesam na obra, a árvore de composições foi percorrida até a folha:
       cada equipamento com sua quantidade, seu fator de utilização e sua contribuição em hora por
       unidade. Isso permite separar as três causas possíveis da dispersão — <b>porte do equipamento,
       número de turnos e distância de transporte</b>.</p>
  </div>

  <div class="aviso">
    <b>A distância de transporte não é premissa livre</b>
    A base fixa <b>“DMT até 1.000 m”</b> no item de escavação, e o transporte além disso é pago à parte,
    no item de momento extraordinário (1,50 milhão de m³×km). Todas as proponentes deveriam, portanto,
    precificar o mesmo percurso. O porte dos equipamentos também é próximo entre elas — caminhão de
    16 m³ na Empa/TDEC, 28 a 36 t na Aterpa, na Ápia e na R&D. E o número de turnos não interfere,
    porque hora-por-m³ é uma medida neutra a jornada. Sobrando essas três, o que resta explicando a
    diferença é <b>premissa de produtividade</b>.
  </div>

  ${Object.entries(F.itens).map(([item, d]) => {
    const props = ordem.filter(p => d.proponentes[p]);
    return `
    <div class="sec"><h2><span class="mono" style="font-size:14px;color:var(--muted)">${esc(item)}</span> — ${esc(d.desc.slice(0, 62))}</h2>
      <span>${fmt(d.qtd)} ${esc(d.un)}${d.dmtFixo ? ' · DMT fixado em ' + esc(d.dmtFixo) : ''}</span></div>

    <div class="wrap card">
      <table><thead><tr>
        <th>Família de equipamento</th>
        ${props.map(p => `<th class="num" style="color:${CORP[p]}">${esc(p)}</th>`).join('')}
        <th class="num">Referência física</th>
      </tr></thead>
      <tbody>
        ${d.familias.map(fam => `<tr>
          <td><b>${esc(fam.nome)}</b><div style="font-size:11px;color:var(--muted);font-weight:400">${esc(fam.nota)}</div></td>
          ${props.map(p => {
      const g = d.proponentes[p].grupos[fam.nome];
      if (!g || !g.relevante) return '<td class="num" style="color:var(--muted)">—</td>';
      const fora = g.posicao !== 'ok';
      return `<td class="num" style="font-weight:${fora ? 800 : 600};color:${g.posicao === 'lento' ? 'var(--risk)' : g.posicao === 'otimista' ? 'var(--warn)' : 'var(--ink)'}">${fmt(g.produtividade, 0)}</td>`;
    }).join('')}
          <td class="num" style="color:var(--muted)">${fmt(fam.lo)}–${fmt(fam.hi)}</td>
        </tr>`).join('')}
        <tr style="background:var(--soft)">
          <td><b>Total do item</b><div style="font-size:11px;color:var(--muted);font-weight:400">equipamento-hora por ${esc(d.un)}</div></td>
          ${props.map(p => `<td class="num"><b>${fmt(d.proponentes[p].total, 4)}</b></td>`).join('')}
          <td></td>
        </tr>
        <tr>
          <td style="color:var(--muted)">Turnos declarados</td>
          ${props.map(p => `<td class="num">${d.proponentes[p].turnos}</td>`).join('')}
          <td></td>
        </tr>
      </tbody></table>
    </div>
    <p style="font-size:12px;color:var(--muted);margin-top:8px">Valores em <b>m³ por equipamento-hora</b>:
      quanto maior, mais produtiva a premissa. Famílias com menos de 3% das horas do item foram omitidas,
      porque frações de hora distorcem o rendimento implícito.</p>

    <div class="sec" style="margin-top:26px"><h2>Posição contra a referência</h2><span>onde cada premissa cai</span></div>
    <div class="wrap card">
      <table><thead><tr><th>Família</th>${props.map(p => `<th style="color:${CORP[p]}">${esc(p)}</th>`).join('')}</tr></thead>
        <tbody>${d.familias.map(fam => `<tr>
          <td><b>${esc(fam.nome)}</b></td>

T('pendencias', 'Pendências para esclarecimento', 'Pendências', () => {
  const r = calcular();
  return `

    <h1>O que pedir a cada proponente.</h1>
    <p>Lista acionável de lacunas e divergências identificadas, pronta para compor a carta de
       esclarecimentos técnicos de cada empresa.</p>
  </div>
  ${r.map(p => {
    const pend = [];
    p.ausentes.forEach(a => pend.push({ t: 'crit', c: a.cod, n: 'Entregável ausente', d: a.nome + ' não foi localizado em nenhum arquivo da proposta.' }));
    (p.naoAuditaveis || []).forEach(a => pend.push({ t: 'med', c: a.cod, n: 'Entregue sem planilha', d: a.nome + ' foi entregue apenas em ' + (a.formatos || []).join('/').toUpperCase() + '. Solicitar versão em planilha para conferência da memória de cálculo.' }));
    (p.somenteTexto || []).forEach(a => pend.push({ t: 'med', c: a.cod, n: 'Sem anexo dedicado', d: a.nome + ' aparece apenas dentro de "' + (a.evidencia || 'documento consolidado') + '". Solicitar anexo próprio.' }));
    if (p.prazo.inconsistente) pend.push({ t: 'crit', c: 'PRAZO', n: 'Prazo divergente entre documentos', d: 'Foram declarados prazos distintos (' + p.prazo.declarado.map(x => fmt(x, x % 1 ? 1 : 0)).join(', ') + ' meses) em anexos diferentes. Solicitar confirmação do prazo contratual único.' });
    if (!p.cpu.rastreavel) pend.push({ t: 'crit', c: 'T.02', n: 'CPUs sem vínculo com a EAP da Vale', d: 'As composições usam numeração interna da proponente, impedindo conferência item a item contra a planilha de quantidades. Solicitar tabela de correspondência.' });
    if (p.cpu.comProducao === 0) pend.push({ t: 'crit', c: 'T.02', n: 'Composições sem produção de equipe', d: 'Nenhuma composição declara a produção horária da equipe, o que impede validar a coerência entre CPU, produtividade e prazo.' });
    if (!p.recursos.diesel) pend.push({ t: 'med', c: 'T.08', n: 'Sem previsão de diesel', d: 'Impede aferir a coerência entre frota mobilizada e consumo energético da obra.' });
    if (!p.recursos.produtividadeItens) pend.push({ t: 'med', c: 'T.09', n: 'Sem índices de produtividade em planilha', d: 'Solicitar os índices em formato tabular para cruzamento com as CPUs.' });
    if (p.digitalizados > 6) pend.push({ t: 'baixa', c: 'DOC', n: p.digitalizados + ' documentos digitalizados', d: 'Documentos entregues como imagem, sem texto pesquisável. Dificultam auditoria e rastreabilidade.' });
    if (p.prazo.duracaoHistograma >= 30) pend.push({ t: 'crit', c: 'PRAZO', n: 'Prazo significativamente superior', d: 'A mobilização declarada se estende por ' + p.prazo.duracaoHistograma + ' meses, contra 21–23 meses das demais. Solicitar justificativa e avaliar impacto contratual.' });

    // --- achados da auditoria de fechamento interno ---
    const ca = A().coerencia[p.nome], qa = A().qualidadeCPU[p.nome], va = A().vertical[p.nome], dv = A().desvios[p.nome];
    if (ca) {
      if (ca.razao && ca.razao > 1.35) pend.push({
        t: 'crit', c: 'T.02×T.08', n: 'Proposta não fecha entre CPU e frota',
        d: 'O escopo já verificado (' + fmt(ca.cobertura, 0) + '% da quantidade) exige ' + fmt(ca.razao, 2) + '× todas as horas de equipamento da frota declarada na planilha de diesel. Solicitar memória de cálculo que concilie composições, histograma de equipamentos e consumo energético.'
      });
      if (ca.razao && ca.razao < 0.7) pend.push({
        t: 'med', c: 'T.02×T.05', n: 'Frota mobilizada acima do consumo das CPUs',
        d: 'A frota declarada equivale a ' + fmt(1 / ca.razao, 2) + '× as horas que as composições consomem. Solicitar justificativa: reserva de capacidade, ociosidade precificada ou divergência de premissa.'
      });
      if (ca.naoVerifN > 3) pend.push({
        t: 'med', c: 'T.02', n: ca.naoVerifN + ' composições sem par de comparação',
        d: 'Equivalem a ' + fmt(ca.naoVerifH) + ' equipamento-hora que nenhuma outra proponente cotou, sem âncora de verificação. Solicitar detalhamento das premissas adotadas.'
      });
    }
    if (qa && qa.reinterpretadas >= 5) pend.push({
      t: 'crit', c: 'T.02', n: qa.reinterpretadas + ' composições com convenção trocada',
      d: 'Lançadas como total do item em vez de consumo por unidade, na mesma planilha em que outras usam a forma correta. Solicitar reemissão da CPU com convenção única.'
    });
    if (qa && qa.descartadas >= 10) pend.push({
      t: 'crit', c: 'T.02', n: qa.descartadas + ' composições ilegíveis',
      d: 'Valores de consumo que não cabem em nenhuma interpretação plausível — nem por unidade, nem como total do item. Comprometem a auditabilidade do preço.'
    });
    if (va && va.classeA.length >= 5) pend.push({
      t: 'med', c: 'T.02', n: va.classeA.length + ' itens classe A sem recurso próprio',
      d: 'Serviços de alto peso aparecem na CPU apenas como subcontratação, sem equipamento nem mão de obra declarados. Solicitar identificação dos subcontratados e comprovação de capacidade.'
    });
    if (dv && dv.total >= 15) pend.push({
      t: 'crit', c: 'T.18', n: dv.total + ' desvios e premissas declarados',
      d: 'O maior volume entre as cinco. Cada item condiciona a oferta e desloca risco para a Vale. Exigir consolidação e negociação item a item antes da equalização comercial.'
    });

    const ord = { crit: 0, med: 1, baixa: 2 };
    pend.sort((a, b) => ord[a.t] - ord[b.t]);
    return `
      <div class="sec"><h2 style="color:${p.cor}">${esc(p.nome)}</h2>
        <span>${pend.length} pendência(s) · ${pend.filter(x => x.t === 'crit').length} crítica(s)</span></div>
      <div class="lista">
        ${pend.length ? pend.map(x => `
          <div class="item">
            <div>
              <span class="tag ${x.t === 'crit' ? 'risk' : x.t === 'med' ? 'warn' : 'neu'}"><i></i>${x.t === 'crit' ? 'crítica' : x.t === 'med' ? 'média' : 'baixa'}</span>
              <div class="cod" style="margin-top:6px">${esc(x.c)}</div>
            </div>
            <div><b>${esc(x.n)}</b><p>${esc(x.d)}</p></div>
          </div>`).join('')
        : '<div class="card vazio">Nenhuma pendência identificada.</div>'}
      </div>`;
  }).join('')}`;
});

  const t = TELAS.find(x => x.id === atual);
  $('#telas').innerHTML = `<section class="screen on"><div class="page">${t.render()}</div></section>`;
  document.querySelectorAll('[data-tela]').forEach(b => b.classList.toggle('on', b.dataset.tela === atual));
  ligarPesos();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function ligarPesos() {
  document.querySelectorAll('[data-w]').forEach(inp => {
    inp.addEventListener('input', e => {
      PESOS[e.target.dataset.w] = +e.target.value;
      presetAtivo = null;
      render();
      const novo = document.querySelector(`[data-w="${e.target.dataset.w}"]`);
      if (novo) novo.focus();
    });
  });
  document.querySelectorAll('[data-preset]').forEach(b => {
    b.addEventListener('click', () => {
      Object.assign(PESOS, PRESETS[b.dataset.preset]);
      presetAtivo = b.dataset.preset;
      render();
    });
  });
  const rsh = $('#rsh');
  if (rsh) rsh.addEventListener('change', e => {
    const v = +e.target.value;
    if (v > 0) { RS_HORA = v; render(); const n2 = $('#rsh'); if (n2) n2.focus(); }
  });
}

function montarNav() {
  $('#nav').innerHTML = TELAS.map((t, i) =>
    `<button data-tela="${t.id}"><span class="n">${String(i + 1).padStart(2, '0')}</span><span>${esc(t.titulo)}</span></button>`).join('');
  $('#mob').innerHTML = TELAS.slice(0, 4).map(t =>
    `<button data-tela="${t.id}">${esc(t.curto)}</button>`).join('');
  document.querySelectorAll('[data-tela]').forEach(b =>
    b.addEventListener('click', () => { atual = b.dataset.tela; render(); }));
}

$('#logo').src = MARCA_NEG;
$('#selo').textContent = PR.length + ' proponentes · 1ª rodada';
montarNav();
render();
</script>
<script>
(() => {
  const gate = document.getElementById('ficoAccessGate');
  const form = document.getElementById('ficoAccessForm');
  const password = document.getElementById('ficoAccessPassword');
  const remember = document.getElementById('ficoRememberAccess');
  const error = document.getElementById('ficoAccessError');
  const sessionKey = 'fico_propostas_session';
  const accessApi = 'https://fico-versioning-api.automacaofico.workers.dev';
  const unlock = () => { gate.hidden = true; document.documentElement.style.overflow = ''; };
  document.documentElement.style.overflow = 'hidden';
  if (localStorage.getItem(sessionKey) || sessionStorage.getItem(sessionKey)) unlock();
  form.addEventListener('submit', async event => {
    event.preventDefault();
    const button = form.querySelector('button');
    button.disabled = true; button.textContent = 'Validando…'; error.textContent = '';
    try {
      const response = await fetch(accessApi + '/api/v1/auth/session', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:password.value,user:'contratacao-fico'})});
      if (!response.ok) throw new Error('Senha inválida ou acesso indisponível.');
      const session = await response.json();
      sessionStorage.setItem(sessionKey, session.token);
      if (remember.checked) localStorage.setItem(sessionKey, session.token); else localStorage.removeItem(sessionKey);
      unlock();
    } catch (cause) { error.textContent = cause.message; }
    finally { button.disabled = false; button.textContent = 'Acessar análise'; }
  });
})();
</script>
