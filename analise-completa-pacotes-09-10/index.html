<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FICO · Análise Técnica de Propostas — Pacotes 09 e 10</title>
<style>
:root{
  --fico:#2876B9; --fico-deep:#10578F; --fico-dark:#0B3D66; --laranja:#F6A01A;
  --ink:#123247; --muted:#5A7180; --line:#D8E3E9; --paper:#F4F8FA; --surface:#fff; --soft:#EDF4F7;
  --ok:#14785C; --warn:#9B6202; --risk:#AB423C; --neutro:#8296A2;
  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:48px;
  --r-sm:4px; --r-md:8px; --r-lg:14px; --nav:252px;
  --sh:0 1px 2px rgba(16,87,143,.06),0 6px 18px rgba(16,87,143,.07);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:Aptos,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3{font-family:"Aptos Display",Aptos,"Segoe UI",sans-serif;letter-spacing:-.02em;margin:0}
a{color:var(--fico-deep)}
.app{display:grid;grid-template-columns:var(--nav) 1fr;min-height:100vh}

/* ---------- navegação ---------- */
aside{background:var(--fico-deep);color:#fff;padding:26px 16px 20px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh}
.brand img{width:132px;display:block}
.brand p{margin:12px 0 0;color:#B9DCF2;font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.nav{display:grid;gap:3px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:var(--r-sm);color:#CFE6F4;font-weight:600;font-size:13.5px;transition:background .15s,color .15s}
.nav button:hover{background:#1A6AA6;color:#fff}
.nav button.on{background:var(--fico);color:#fff}
.nav .n{width:20px;font-size:10px;font-weight:800;color:#7FB8DE}
.nav button.on .n{color:var(--laranja)}
.side-foot{margin-top:auto;border-top:1px solid #2E7CB5;padding-top:14px;color:#AECFE6;font-size:11px;line-height:1.5}
.side-foot b{display:block;color:#fff;font-size:12px;margin-bottom:3px}

/* ---------- estrutura ---------- */
main{min-width:0}
.top{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 34px;display:flex;justify-content:space-between;align-items:center;gap:20px;position:sticky;top:0;z-index:5}
.crumb{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.crumb b{color:var(--fico-deep)}
.selo{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:100px;padding:6px 14px;font-size:11.5px;font-weight:700;color:var(--fico-deep)}
.selo i{width:7px;height:7px;border-radius:50%;background:var(--laranja);display:block}
.page{padding:34px;max-width:1560px;margin:0 auto}
.head{margin-bottom:var(--s4);max-width:900px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fico);font-weight:800;margin:0 0 8px}
.head h1{font-size:31px;line-height:1.12}
.head p{color:var(--muted);margin:10px 0 0;font-size:15px}
.screen{display:none}.screen.on{display:block;animation:in .2s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh)}
.pad{padding:22px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:var(--s5) 0 var(--s2)}
.sec:first-child{margin-top:0}
.sec h2{font-size:18px}
.sec span{font-size:12px;color:var(--muted)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}

/* ---------- tabela ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;background:var(--soft);color:#456575;text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;padding:10px 12px;font-weight:800;white-space:nowrap;position:sticky;top:0}
td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:#FAFCFD}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.wrap{overflow-x:auto;border-radius:var(--r-md)}

/* ---------- etiquetas ---------- */
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:100px;padding:3px 9px;font-size:10.5px;font-weight:800;background:var(--soft);color:#456575;white-space:nowrap}
.tag i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block;flex:none}
.tag.ok{background:#E4F3ED;color:var(--ok)}
.tag.warn{background:#FDF2DC;color:var(--warn)}
.tag.risk{background:#FAE9E7;color:var(--risk)}
.tag.neu{background:#EDF1F3;color:var(--neutro)}

/* ---------- ranking ---------- */
.rank{display:grid;gap:10px}
.rk{display:grid;grid-template-columns:36px 1fr 128px 74px;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:var(--r-md);transition:box-shadow .15s,transform .15s}
.rk:hover{box-shadow:var(--sh);transform:translateX(2px)}
.rk .pos{font-family:"Aptos Display",Aptos,sans-serif;font-size:20px;font-weight:800;color:var(--c);text-align:center}
.rk .nm{font-weight:800;font-size:15px}
.rk .rz{color:var(--muted);font-size:11.5px;font-weight:400}
.rk .bar{height:8px;background:#E9EFF3;border-radius:100px;overflow:hidden}
.rk .bar i{display:block;height:100%;background:var(--c);border-radius:100px;transition:width .45s cubic-bezier(.4,0,.2,1)}
.rk .sc{font-family:"Aptos Display",Aptos,sans-serif;font-size:23px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.rk.lider{background:linear-gradient(100deg,#F7FBFD,#fff)}

/* ---------- pesos ---------- */
.pesos{display:grid;gap:14px}
.peso{display:grid;grid-template-columns:210px 1fr 52px;align-items:center;gap:14px}
.peso label{font-size:13px;font-weight:700}
.peso output{font-variant-numeric:tabular-nums;font-weight:800;color:var(--fico-deep);text-align:right;font-size:13px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:100px;background:#DDE7ED;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:var(--fico-deep);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.28);cursor:pointer}
input[type=range]:focus-visible{outline:3px solid var(--laranja);outline-offset:3px}
.presets{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px}
.chip{border:1px solid var(--line);background:#fff;border-radius:100px;padding:6px 13px;font-size:11.5px;font-weight:700;color:var(--fico-deep);transition:.15s}
.chip:hover{border-color:var(--fico);background:#F2F8FC}
.chip.on{background:var(--fico-deep);color:#fff;border-color:var(--fico-deep)}

/* ---------- métricas ---------- */
.kpi{padding:16px 18px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.kpi span{display:block;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.kpi strong{display:block;font-family:"Aptos Display",Aptos,sans-serif;font-size:27px;line-height:1.15;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:11.5px;color:var(--muted)}
.kpi b{font-size:11.5px;color:var(--laranja-esc,#9B6202);font-weight:700}

/* ---------- matriz ---------- */
.mx td:first-child{font-weight:700}
.nota{display:inline-flex;align-items:center;justify-content:center;min-width:46px;padding:4px 8px;border-radius:var(--r-sm);font-weight:800;font-variant-numeric:tabular-nums;font-size:13px}
.n-alto{background:#E4F3ED;color:var(--ok)}
.n-medio{background:#FDF2DC;color:var(--warn)}
.n-baixo{background:#FAE9E7;color:var(--risk)}

/* ---------- gráfico ---------- */
.legenda{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.legenda i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legenda span{font-size:12px;font-weight:700;color:#3E5967}
svg{display:block;max-width:100%;height:auto;overflow:visible}
.gx{font-size:9.5px;fill:var(--muted)}
.gy{font-size:9.5px;fill:var(--muted)}
.grid-l{stroke:#E8EEF2;stroke-width:1}

/* ---------- detalhe ---------- */
.dim{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.dim>summary{padding:14px 18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:14px;font-weight:700;list-style:none;background:var(--soft)}
.dim>summary::-webkit-details-marker{display:none}
.dim>summary::after{content:"▾";color:var(--muted);font-size:12px;transition:.2s}
.dim[open]>summary::after{transform:rotate(180deg)}
.dim .body{padding:16px 18px;border-top:1px solid var(--line)}
.ind{display:grid;grid-template-columns:1fr auto;gap:6px 18px;font-size:13px}
.ind dt{color:var(--muted)}
.ind dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.pen{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:grid;gap:5px}
.pen div{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--risk)}
.pen b{font-variant-numeric:tabular-nums}

.aviso{background:#FFF8E9;border:1px solid #F0DCB0;border-left:4px solid var(--laranja);border-radius:var(--r-md);padding:16px 18px;font-size:13.5px}
.aviso b{display:block;margin-bottom:4px;color:#7A4E02}
.destaque{background:linear-gradient(115deg,var(--fico-deep),var(--fico));color:#fff;border-radius:var(--r-lg);padding:28px 30px;position:relative;overflow:hidden}
.destaque:after{content:"";position:absolute;width:250px;height:250px;border:34px solid rgba(255,255,255,.07);border-radius:50%;right:-90px;bottom:-130px}
.destaque h2{font-size:22px;margin-bottom:8px;position:relative;z-index:1}
.destaque p{margin:0;color:#DCEFFA;max-width:640px;position:relative;z-index:1;font-size:14px}
.destaque .pill{display:inline-block;background:rgba(255,255,255,.16);border-radius:100px;padding:4px 12px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;position:relative;z-index:1}

.lista{display:grid;gap:9px}
.item{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:13px 16px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);font-size:13.5px}
.item .cod{font-weight:800;color:var(--fico-deep);font-size:12px;min-width:52px}
.item p{margin:3px 0 0;color:var(--muted);font-size:12.5px}

.mono{font-family:Consolas,"SF Mono",monospace;font-size:12px}
.filtros{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.vazio{padding:28px;text-align:center;color:var(--muted);font-size:13.5px}
.mob{display:none}
@media(max-width:1120px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}
@media(max-width:900px){
  :root{--nav:0px}
  .app{grid-template-columns:1fr}
  aside{display:none}
  .page{padding:20px 16px 96px}
  .g2,.g4{grid-template-columns:1fr}
  .top{padding:12px 16px}
  .head h1{font-size:25px}
  .rk{grid-template-columns:30px 1fr 64px;gap:10px}
  .rk .bar{display:none}
  .peso{grid-template-columns:1fr;gap:5px}
  .peso output{text-align:left}
  .mob{display:grid;position:fixed;bottom:0;left:0;right:0;z-index:20;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(16,87,143,.09)}
  .mob button{font-size:10px;font-weight:700;color:var(--muted);padding:8px 2px;min-height:46px;border-radius:var(--r-sm)}
  .mob button.on{color:var(--fico-deep);background:var(--soft)}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media print{aside,.top,.mob,.pesos,.presets{display:none}.app{grid-template-columns:1fr}.screen{display:block!important}}
.fico-auth-gate{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;padding:24px;background:#0b3d66;color:#123247;font-family:Aptos,"Segoe UI",system-ui,sans-serif}.fico-auth-gate[hidden]{display:none!important}.fico-auth-card{width:min(420px,100%);padding:30px;border-radius:14px;background:#fff;box-shadow:0 28px 80px rgba(0,0,0,.3)}.fico-auth-card h1{margin:0 0 8px;font-size:26px;color:#0b3d66}.fico-auth-card>p{margin:0 0 22px;color:#5a7180}.fico-auth-card label{display:grid;gap:7px;font-weight:700}.fico-auth-card input[type=password]{width:100%;padding:12px 13px;border:1px solid #c8d7df;border-radius:8px;font:inherit}.fico-auth-card button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:8px;background:#2876b9;color:#fff;font:700 15px inherit;cursor:pointer}.fico-auth-card button:disabled{opacity:.65}.fico-auth-remember{grid-template-columns:auto 1fr!important;align-items:center;margin-top:13px;font-size:13px}.fico-auth-remember input{margin:0}.fico-auth-hint{margin-top:16px;color:#5a7180;font-size:13px}.fico-auth-hint summary{cursor:pointer;font-weight:700;color:#2876b9}.fico-auth-hint p{margin:7px 0 0}.fico-auth-error{min-height:20px;margin-top:10px;color:#ab423c;font-size:13px;font-weight:700}
</style>
</head>
<body>
<div class="fico-auth-gate" id="ficoAccessGate"><form class="fico-auth-card" id="ficoAccessForm"><h1>Pacotes 09 e 10</h1><p>A senha é exigida em toda nova abertura.</p><label>Senha de acesso<input id="ficoAccessPassword" type="password" autocomplete="current-password" required></label><button type="submit">Acessar análise</button><div class="fico-auth-error" id="ficoAccessError" role="alert"></div><details class="fico-auth-hint"><summary>Relembrar senha</summary><p>Contrato + números dos pacotes, sem espaços.</p></details></form></div>
<div class="app">
  <aside>
    <div class="brand">
      <img id="logo" alt="FICO — Ferrovia de Integração Centro-Oeste">
      <p>Análise técnica</p>
    </div>
    <nav class="nav" id="nav" aria-label="Navegação principal"></nav>
    <div class="side-foot">
      <b>Avaliação técnica</b>
      Nenhum dado comercial considerado. Preços removidos na origem.
    </div>
  </aside>

  <main>
    <header class="top">
      <div class="crumb">FICO / Contratação de obras / <b>Pacotes 09 e 10</b></div>
      <div class="selo"><i></i><span id="selo">5 proponentes · 1ª rodada</span></div>
    </header>
    <div id="telas"></div>
  </main>
</div>
<nav class="mob" id="mob" aria-label="Navegação"></nav>

s utilizadas durante a obra, mas não construídas pela MOTA ENGIL, serão de responsabilidade da VALE, salvo se os danos decorrerem de comprovada negligência da MOTA ENGIL."},{"ref":"","classe":"PREMISSAS E CONSIDERAÇÕES","desc":"A Proposta contempla recursos para plano de chuvas com base nas médias históricas da região. Índices pluviométricos que excedam em 20% (vinte por cento) a média histórica mensal, ou que causem paralisação comprovada das frentes de serviço por mais de 5 (cinco) dias consecutivos, serão tratados como evento extraordinário, com direito a prorrogação de prazo."},{"ref":"","classe":"PREMISSAS E CONSIDERAÇÕES","desc":"Não consideramos em nossa proposta nenhum serviço de rebaixamento de lençol citado no \"DT-15221FE-X-500001\", pois não está previsto na PQ, bem como em outras áreas da obra onde ocorra manifestação de água do lençol freático interferindo com os serviços previstos."},{"ref":"","classe":"PREMISSAS E CONSIDERAÇÕES","desc":"Não consideramos em nossa proposta a execução de quaisquer estacas de sacrifício para as provas de carga previstas na PQ."},{"ref":"","classe":"PREMISSAS E CONSIDERAÇÕES","desc":"Para a Ponte do Rio das Mortes não estamos alterando a infra e mesoestruturas das pontes consequentemente mantivemos as quantidades de estacas e estruturas de concreto da proposta básica (concreto, forma, armação, etc.) pois os novos cálculos estruturais para estas estruturas serão desenvolvidos após a assinatura do contrato juntamente com o projeto alternativo da estrutura metálica da ponte."},{"ref":"","classe":"PREMISSAS E CONSIDERAÇÕES","desc":"Para viabilização do lançamento da estrutura metálica na opção alternativa, estamos agregando 2 apoios centrais dentro do curso d’água (e estimamos todos os seus quantitativos) e tais apoios serão removidos e destinados a bota fora aprovado ao término da sua construção."},{"ref":"","classe":"PREMISSAS E CONSIDERAÇÕES","desc":"De acordo com a PQ da VALE, os encontros E1 e E2 e os pilares P1 e P6 tem  equipes parad"},{"ref":"INTERFERÊNCIAS","classe":"PREMISSA/DESVIO","desc":"A presente proposta não considera a gestão, remoção e relocação de interferências não mapeadas. Durante as operações da TDEC no site do empreendimento e áreas afetadas, caso ocorra a surgência de alguma interferência não mapeada, incluindo sitíos arqueológicos, assentamentos rurais, objetos e estruturas enterradas, redes elétricas e hidráulicas, etc. propomos que seja registrado no RDO todos recur"},{"ref":"ADMINISTRAÇÃO LOCAL","classe":"PREMISSA/DESVIO","desc":"Devido a complexidade das intervenções que serão realizadas e a possibilidade da ocorrência de atrasos por motivos alheios a atuação da TDEC, como alterações de escopo, condições locais e de quantidades, entendemos ser essencial a medição da administração local em formato diferente. Dessa forma, a presente proposta é apresentada considerando alteração do modelo de remuneração da Administração Loca"},{"ref":"SEGUROS","classe":"PREMISSA/DESVIO","desc":"A presente proposta contempla exclusivamente a cobertura na modalidade Seguro Garantia, limitada ao percentual estabelecido na RT do processo. Assim, quaisquer outros seguros ou coberturas adicionais (Seguro de Responsabilidade Civil, Seguro de Riscos de Engenharia, etc) que eventualmente se façam necessários serão de responsabilidade da Vale e abrangerão a atuação da TDEC, sem geração de ônus à c"},{"ref":"AGULHAMENTO DE MATERIAL","classe":"PREMISSA/DESVIO","desc":"Os volumes de aterro e aplicação de material granular seguem os quantitativos da planilha VALE, dessa forma, não contempla possíveis sobreconsumos com agulhamento de material no momento da aplicação (ocorrências para caso de subleitos e solos compressíveis). Caso o consumo destes materiais de aterro e agregados seja maior que o previsto, tendo como consequência maior demanda de aquisição, carga, t"},{"ref":"SOLOS PARA ATERROS","classe":"PREMISSA/DESVIO","desc":"O presente orçamento não contempla a aquisição de solos para execução de aterros e demais aplicações que demandem o uso de solo. Assim, esta proposta considera que todos os solos de aterro utilizados na obra serão integralmente provenientes das escavações obrigatórias previstas nas áreas de empréstimo lateral. Adicionalmente, considera-se que todos os solos destinados a essas finalidades apresenta"},{"ref":"RETENÇÃO CMS E RT","classe":"PREMISSA/DESVIO","desc":"Não consideramos a aplicação de retenções, glosas e/ou penalização na medição dos serviços, seja por aplicação de Check-Lists de QSSMA, entregáveis, alterações em prazo ou avaliações mensais, dessa forma, propomos desvio ao citado nos documentos RT-1000FE-B-500018 e CM-1000FE-B-500004 sobre o tema. Como exemplos: CMS C.25.55.000 - 30% RETENÇÃO - REGULARIZAÇÃO E COMPACTAÇÃO DE PLATAFORMA CMS C.25.5"},{"ref":"MANUTENÇÃO DE ACESSOS","classe":"PREMISSA/DESVIO","desc":"Não consideramos em nossos custos a manutenção do acesso entre os munícipios de Nova Nazare-MT, Cocalinho/MT, Água Boa/MT até as frentes obra, visto que são estradas rurais existentes de domínio público. Os recursos foram dimensionados considerando apenas a manutenção dos acessos internos da obra."},{"ref":"ESCORAMENTO DE CAVAS E VALAS","classe":"PREMISSA/DESVIO","desc":"A presente proposta não considera a utilização de blindagem e escoramento continuos e descontinuos das escavações de cavas, valas e demais escavações previstas na obra. Quando necessário, a presente proposta considera que as escavações, quando necessários, terão suas larguras aumentadas com a inclinação necessária para garantir a segurança das execuções e estes volumes acrescidos serão medidos nos"}],"temas":{"BIM":11,"Last Planner":0,"Primavera P6":1,"MS Project":5,"Drone/topografia digital":18,"Telemetria de frota":6,"Britagem própria":1,"Usina de concreto":15,"Plano de chuvas":48,"Rio das Mortes":77,"Ponte/OAE":172,"Subcontratação":823,"ISO 9001":27,"ISO 14001":25,"ISO 45001":53}}],"abc":{"resumo":{"A":27,"B":49,"C":275},"top":[{"item":"3.3.1.2 E, ficou entendido que o solo chamado de saturado ou s olo de b aixa c apacidade de s uporte , não se trata de solo mole e que tão somente seria um solo com teor de umidade acima do normalmente encontrado na condição “in situ”, para solos de 1ª e 2ª categorias. Caso sejam encontrados pontos com ocorrência de solo mole, onde haja a necessidade de emprego de escavação para esta condição, deverá ser criado um item específico no projeto, de forma a representar este item, para que o mesmo seja remunerado;"},{"ref":"","tipo":"desvio","tema":"Prazo e licenças","desc":"Para as condições de tratamento de NA elevado, considerando que a escavação deste orçamento é executada em caixas de empréstimo lateral, caso ocorram nos serviços de terraplenagem, estas serão devidamente tratadas pela ATERPA, conforme metodologia executiva anexa a esta proposta, sendo os serviços medidos em itens de planilha. Caso alguns desses serviços, como a instalação de sistema de drenos profundo s ou a secagem do material em razão do excesso de umidade, não possuam item específico na planilha de quantidades, deverão ser tratados em comum acordo com a VALE ;"},{"ref":"","tipo":"desvio","tema":"Prazo e licenças","desc":"A abertura e a manutenção dos acessos necessários à execução da obra são de responsabilidade da ATERPA , conforme estabelecido na documentação técnica disponibilizada pela VALE. Nesse sentido, estamos considerando a mobilização de equipamentos para abertura de acessos pelo período de 3 (três) meses, no início do contrato, além de equipamentos pa ra manutenção dos acessos identificados ao Clicksign abfe65e5-b1fb-47c4-9350-a66fa0620a53 longo de todo o período de execução da obra. Caso, no decorrer da execução contratual, seja necessária a abertura de novos acessos não identificados ou não previs"},{"ref":"","tipo":"desvio","tema":"Prazo e licenças","desc":"Não estamos considerando o fornecimento do material de forro para os acessos, ficando este material sob responsabilidade de fornecimento pel a VALE , cabendo à ATE RPA apenas a mobilização de equipamentos para sua aplicação ;"},{"ref":"","tipo":"desvio","tema":"Prazo e licenças","desc":"Especificamente para o acesso ao Rio das Mortes, está prevista a implantação de um acesso de maior porte, contemplando aterro com altura de até 3,0 m, em razão do histórico de inundações da região. Estamos considerando na proposta que o material necessário para a execução desse aterro será disponibilizado pela VALE, próximo ao local das obras. Está prevista a utilização do acesso existente nas proximidades da área de intervenção para a execução d esse aterro. Foi considerado um acesso com aproximadamente 4 km de extensão, 10 m de largura e aterro com altura média de até 3,0 m. Não estamos cons"},{"ref":"","tipo":"desvio","tema":"Preço e reajuste","desc":"Durante a visita técnica, verificou-se que um dos acessos necessários à obra (coordenadas 13º58'34.61\"S e 38º14'61\"W) exige a construção de uma nova ponte de aproximadamente 20m, com terraplenagem associada, e a posterior demolição da ponte existente, hoje inoperante e sem capacidade de suporte para o tráfego de equipamentos. O custo desse serviço foi incluído no item de Construção de Canteiro de Obras, por ser necessário de ser executado no início do contrato. O escopo definitivo poderá ser diferente do considerado, podendo este item ser objeto de acordo entre as partes e, eventualmente, incl"},{"ref":"","tipo":"desvio","tema":"Preço e reajuste","desc":"Não estamos considerando perdas de produtividade, paralisações ou quaisquer impactos decorrentes de interferências relacionadas às comunidades indígenas. Caso tais ocorrências venham a impactar a execução dos serviços, seus efeitos sobre prazo, custos e produtividade deverão ser objeto de avaliação e consenso entre as partes, visando ao reequilíbrio co ntratual, quando aplicável ;"},{"ref":"","tipo":"desvio","tema":"Prazo e licenças","desc":"Estamos considerando que a VALE será responsável pelo afugentamento de fauna e flora;"},{"ref":"","tipo":"desvio","tema":"Prazo e licenças","desc":"Entendemos que o consumo de óleo diesel considerado nesta proposta foi estimado com base no cronograma físico e nos quantitativos vigentes na data desta proposta, sendo diretamente proporcional às horas de operação dos equipamentos previstos. Dessa forma, quaisquer replanejamentos do cronograma ou variações nos quantitativos ao longo da execução contratual deverão implicar o ajuste proporcional do consumo de óleo diesel e do respectivo custo, a ser revisto periodicamente em conjunto com a VALE ;"},{"ref":"","tipo":"desvio","tema":"Preço e reajuste","desc":"Conforme informado na carta-proposta comercial, estamos propondo, como alternativa para redução do preço global, uma solução distinta ao projeto base, com a execução da superestrutura metálica em treliça pelo método de lançamento por empurramento. Nesta alternativa, propomos também outras alterações na metodologia de execução, como a execução de aterro de conquista, tendo em vista que, em nosso entendimento , o projeto base não deixa claro se essa solução seria permitida . Co m base em nossa experiência em obras próximas, do mesmo projeto , ela se mostra tecnicamente factível e financeiramente"},{"ref":"","tipo":"desvio","tema":"Prazo e licenças","desc":"Para a ex e cução d as camisas metálicas não estamos considerando ensaio não destrutivo; Clicksign abfe65e5-b1fb-47c4-9350-a66fa0620a53"},{"ref":"","tipo":"desvio","tema":"Prazo e licenças","desc":"Para os custos de Administração Local e de Manutenção/Operação de Canteiro de Obras, não está sendo considerado o critério de mediç ão por verba vinculada ao avanço financeiro acumulado da obra, estabelecido nos respectivos itens da documentação técnica [8.3 – CMS C.01.10.005 e 8.2 – CMS C.05.05.020]. Isso porque esses custos são predominantemente vinculados ao prazo de execução da obra, e não ao ritmo de avanço físico-financeiro, o que gera descolamento entre custo incorrido e receita medida, especialmente em eventuais atrasos não imputáveis à ATERPA. Em nossa proposta comercial, é apresentad"},{"ref":"","tipo":"desvio","tema":"Prazo e licenças","desc":"Para os serviços de escavação, carga, transporte, descarga e espalhamento de solo, estamos considerando que não haverá retenção e que o critério de medição item 11.7.1 [CMS C.25.50.000] deverá ser revisado."},{"ref":"","tipo":"desvio","tema":"Prazo e licenças","desc":"Constatamos que diversos critérios de medição da documentação técnica preveem retenção de 10% do valor da verba do respectivo item, condicionada ao atendimento de exigências específicas de cada item (ex.: correção de pendências, conclusão de drenagem, pendências ambientais, recomposição ambiental, entre outras). Para todos esses itens, estamos considerando que não haverá retenção e que o s critério s de medição dever ão ser revisado s ."},{"ref":"","tipo":"desvio","tema":"Prazo e licenças","desc":"Não estamos considerando aproveitamento de estrutura de canteiro, ao final do contrato, uma vez que a Requisição técnica prevê a possibilidade de a VALE, caso queira, possa ficar com a instalação;"},{"ref":"","tipo":"desvio","tema":"Prazo e licenças","desc":"A VALE será responsável pela remoção das interferências elétricas na área da obra, cuja conclusão é esperada antes do início dos serviços contratados. Caso Clicksign abfe65e5-b1fb-47c4-9350-a66fa0620a53 isso não ocorra e haja impacto em prazo, custo ou produtividade, tal impacto deverá ser tratado em conjunto com a VALE ;"},{"ref":"","tipo":"desvio","tema":"Prazo e licenças","desc":"Estamos considerando a utilização de grupos gerado res para suprir a energia necessária para todas as atividades inerentes a este contrato. Ou seja, não estamos prevendo a utilização de energia disponibilizada pela Concessionária de energia do estado;"},{"ref":"","tipo":"desvio","tema":"Prazo e licenças","desc":"Como previsto na Requisição Técnica, que “A CONTRATADA será responsável pela execução do Plano de Recuperação de Áreas Degradadas na faixa de domínio, devendo apresentar o plano desenvolvido para aprovação pela VALE, para posterior execução”. Diante da colocação acima, entendemos sim que será de nossa responsa bilidade e que apresentaremos o Plano em momento oportuno, caso contratados. Os serviços a serem executados, seus respectivos quantitativos e custos, serão tratados futuramente, em fase de contrato em andamento. Clicksign abfe65e5-b1fb-47c4-9350-a66fa0620a53 21_Lista_Desvios_Premissas.pd"}]},"Consag":{"total":11,"desvios":6,"premissas":5,"porTema":{"Prazo e licenças":9,"Preço e reajuste":2},"lista":[{"ref":"PQ-1000FE-B-500029_REV 0 - 24.06.26 - Item 1.1.3.1.1.3 e 3.3.1.1.1.3","tipo":"desvio","tema":"Prazo e licenças","desc":"Nossa proposta considera, para este item, exclusivamente a execução da supressão de vegetação rasteira, incluindo a remoção do material para área de depósito com DMT de até 350 m. Entendemos que os serviços de supressão com destocamento e limpeza de árvores, para todos os diâmetros previstos, já estão contemplados em itens específicos da Planilha de Quantidades (PQ), não sendo considerados novamente na composição deste item."},{"ref":"CM-1000FE-B-500004_REV 0 - 26_05_26 – Item 8.3, página 27","tipo":"desvio","tema":"Prazo e licenças","desc":"Esta Proposta considera que medição do item “Administração Local” se dará em 21 verbas mensais, com início no mês seguinte à emissão da OS, e até o último mês de execução das obras (excluindo-se o período de desmobilização)."},{"ref":"CM-1000FE-B-500004_REV 0 - 26_05_26 – Item 8.2, página 25","tipo":"desvio","tema":"Prazo e licenças","desc":"Esta Proposta considera que medição do item “Manutenção e Operação do Canteiro” se dará em 19 verbas mensais, com início após a conclusão da construção do canteiro principal, e até o último mês de execução das obras (excluindo-se o período de desmobilização). Sobre a lista de verificação, entendemos que caso haja algum desvio, ocorrerá glosa da medição naquele mês, que deverá ser liberada mediante regularização da pendência."},{"ref":"CM-1000FE-B-500004_REV 0 - 26_05_26 – Item 7.1, página 17","tipo":"desvio","tema":"Prazo e licenças","desc":"Esta Proposta considera que a medição do item de “Mobilização de Pessoal e Equipamentos” se dará pelo CMS C.01.05.000, considerando os seguintes desvios: - O percentual a ser medido após a emissão da ordem serviço será de 30%; - Consequentemente, o percentual a ser medido pela aderência em relação ao histograma contratual será de 40%, sendo ainda que esta aderência deverá ser medida em relação ao pico previsto para o 1º ano de projeto; - Além disso, considera-se que os percentuais a serem medidos mediante entrega do planejamento e programas de qualidade e SMS não estarão vinculados a uma aprov"},{"ref":"CM-1000FE-B-500004_REV 0 - 26_05_26 – Item 8.1, página 27","tipo":"desvio","tema":"Prazo e licenças","desc":"Esta Proposta considera que a medição do item de “Instalação de Canteiro Principal” se dará de acordo com os seguintes percentuais ajustados em relação ao CMS C.05.05.005: - 15% do valor será medido após a apresentação dos projetos executivos pela Contratada, desde que contemplem toda a documentação e conteúdo exigido pela VALE, em conformidade com as Normas vigentes aplicáveis, assim como não apresentem nenhum vício ou desconformidade grave; - 5% do valor será medido após a aprovação dos projetos executivos pela VALE - 70% de acordo com o avanço físico da construção do canteiro de obras (edif"},{"ref":"CM-1000FE-B-500004_REV 0 - 26_05_26 – Item 17.1, página 131","tipo":"desvio","tema":"Preço e reajuste","desc":"Esta Proposta considera que o Critério de Medição deverá contemplar um item específico para a medição da Fabricação e Fornecimento de Estruturas Metálicas, já que o CMS C.75.10.005 se refere mais especificamente aos trabalhos de montagem e instalação. Dada a relevância deste item no preço do projeto, é nosso entendimento que esta Fabricação e Fornecimento deverá ser medida e remunerada de acordo com as condições de pagamento ao fornecedor, e com antecedência ao início dos trabalhos de montagem em campo; Além disso, entendemos que o critério CMS C.75.10.005 poderá ser discutido entre as Partes,"},{"ref":"GERAL","tipo":"premissa","tema":"Prazo e licenças","desc":"Resgate Vertical - Nossa proposta considera que o resgate vertical, se necessário, será realizado por pessoa do quadro de funcionarios, que será treinada e estará apta a realizar tal atividade."},{"ref":"Item 4.4.10.1.1.1 da PQ datada de 24.06.26","tipo":"premissa","tema":"Prazo e licenças","desc":"Nossa proposta foi elaborada considerando o quantitativo informado na PQ, correspondente a 1.504,85 toneladas de estrutura metálica. Entretanto, a partir da análise dos projetos disponibilizados, identificamos um quantitativo aproximado de 1.166 toneladas, considerando arco, tabuleiro e vigas metálicas. Em nosso entendimento, há uma possível duplicidade na contabilização das vigas metálicas, uma vez que, conforme resposta ao esclarecimento anteriormente encaminhada, foi informado que o arco possui peso de 1.166 toneladas e as vigas metálicas 338 toneladas. Todavia, pela interpretação dos desen"},{"ref":"PQ datada de 24.06.26","tipo":"premissa","tema":"Preço e reajuste","desc":"Nosso entendimento é que existe uma omissão na QQP, já que não está previsto itens de regularização e tratamento do sub-leito. Na resposta ao questionamento 81 sobre esta questão, por engano foi respondido que qualquer necessídade de substituição do sub-leito será remunerado pelos respectivos itens de escavação, transporte e compactação de aterro, sem, no entanto, abordar o tema questionado. Portanto, nossa proposta considera que numa posterior revisão da PC, a QQP deverá ser revisada para passar a contemplar este serviço, não tendo sido contemplado no preço apresentado."},{"ref":"PQ-1000FE-B-500029_REV 0 - 24.06.26 - Item 1.1.5.4.1.1","tipo":"premissa","tema":"Prazo e licenças","desc":"Verificamos que o quantitativo desse item na PQ foi aparentemente obtido (com pequenas diferenças) a partir do volume total da coluna G (“VOLUME GEOMÉTRICO – 1ª CAT. (m³)”). Entretanto, e conforme se pode observar no descritivo da coluna J (“DESIGNAÇÃO”), esse quantitativo é composto, além do volume de corte destinado à execução dos aterros (e ao qual se refere o item acima indicado da PQ), pelos seguintes volumes adicionais: • Escavação referentes à camada vegetal (239.890 m3) • Escavação destinados à execução do sublastro (50.890 m3) Entretanto, e a partir da análise dos demais documentos di"},{"ref":"PQ-1000FE-B-500029_REV 0 - 24.06.26","tipo":"premissa","tema":"Prazo e licenças","desc":"Dentre os projetos recebidos na documentação, não identificamos projetos específicos para os itens listados abaixo, referentes aos dispositivos de drenagem superficial previstos para instalação nos Pacotes 5.1, 5.2 e 5.3. Em razão disso, adotamos como base para as estimativas de consumo e para a elaboração das composições projetos de dispositivos com características semelhantes às descritas. Posteriormente, caso os projetos específicos desses itens sejam disponibilizados, as composições serão revisadas e adequadas aos padrões dos dispositivos VALEC. 1.1.7.1.1.1 - Valeta de Proteção Trapezoidal"}]},"Empa/TDEC":{"total":11,"desvios":11,"premissas":0,"porTema":{"Prazo e licenças":8,"Preço e reajuste":3},"lista":[{"ref":"LICENCIAMENTO E CONDICIONANTES","tipo":"desvio","tema":"Prazo e licenças","desc":"Consideramos que todos os licenciamentos necessários a implantação do projeto, supressão vegetal, operação, logística, metodologias praticadas são de responsabilidade da VALE. Não consideramos quaisquer custos e prazos para desapropriações e despesas decorrentes do licenciamentos ambientais do empreendimento (LI e ASV’s) e de quaisquer outros licenciamentos e autorizações que se fizerem necessárias, exceto as licenças indicada na Matriz de Responsabilidades como de competência da Contratada, como Canteiros de Obras Principal, Usinas de Concreto, etc."},{"ref":"CENÁRIO HIDROLÓGICO","tipo":"desvio","tema":"Preço e reajuste","desc":"O planejamento e o preço do empreendimento foram elaborados com base nos dados constantes no Processo de Concurso, nossa Proposta Técnica e a documentação associada, bem como das complementaridades e esclarecimentos subsequentes enviados pela Vale. Caso ocorra situação atípica, em termos de pluviometria, reportada aos dados constantes na nossa proposta, ou seja, períodos de chuvas com precipitações acima do histórico, em até 10%, resultando em menor número de dias trabalháveis do que os indicados em nossa Proposta Técnica, os impactos em prazo e custos (diretos e indiretos) serão analisados e "},{"ref":"PARALISAÇÕES","tipo":"desvio","tema":"Preço e reajuste","desc":"Caso ocorra alguma paralisação na frente de obra decorrente de órgãos externos, influência da comunidade local, fatores geológicos e geotécnicos das estruturas, ou qualquer outro motivo fora aquelas apresentadas na Proposta Técnica, que não seja de responsabilidade da Contratada, propomos que seja registrado no RDO todos recursos paralisados para a devida negociação e remuneração das equipes paradas, com base nos detalhamentos de preços constantes da Proposta Comercial, sendo os impactos em prazo analisados e discutidos junto a VALE."},{"ref":"INTERFERÊNCIAS","tipo":"desvio","tema":"Preço e reajuste","desc":"A presente proposta não considera a gestão, remoção e relocação de interferências não mapeadas. Durante as operações da TDEC no site do empreendimento e áreas afetadas, caso ocorra a surgência de alguma interferência não mapeada, incluindo sitíos arqueológicos, assentamentos rurais, objetos e estruturas enterradas, redes elétricas e hidráulicas, etc. propomos que seja registrado no RDO todos recursos paralisados para a devida negociação e remuneração das equipes paradas, com base nos detalhamentos de preços constantes da Proposta Comercial, sendo os impactos em prazo analisados e discutidos. A"},{"ref":"ADMINISTRAÇÃO LOCAL","tipo":"desvio","tema":"Prazo e licenças","desc":"Devido a complexidade das intervenções que serão realizadas e a possibilidade da ocorrência de atrasos por motivos alheios a atuação da TDEC, como alterações de escopo, condições locais e de quantidades, entendemos ser essencial a medição da administração local em formato diferente. Dessa forma, a presente proposta é apresentada considerando alteração do modelo de remuneração da Administração Local, onde medição da verba proposta para a administração local será em parcelas fixas mensais.Onde: \"Os serviços de administração local (administração, gerenciamento, topografia, controle tecnológico, l"},{"ref":"SEGUROS","tipo":"desvio","tema":"Prazo e licenças","desc":"A presente proposta contempla exclusivamente a cobertura na modalidade Seguro Garantia, limitada ao percentual estabelecido na RT do processo. Assim, quaisquer outros seguros ou coberturas adicionais (Seguro de Responsabilidade Civil, Seguro de Riscos de Engenharia, etc) que eventualmente se façam necessários serão de responsabilidade da Vale e abrangerão a atuação da TDEC, sem geração de ônus à contratada."},{"ref":"AGULHAMENTO DE MATERIAL","tipo":"desvio","tema":"Prazo e licenças","desc":"Os volumes de aterro e aplicação de material granular seguem os quantitativos da planilha VALE, dessa forma, não contempla possíveis sobreconsumos com agulhamento de material no momento da aplicação (ocorrências para caso de subleitos e solos compressíveis). Caso o consumo destes materiais de aterro e agregados seja maior que o previsto, tendo como consequência maior demanda de aquisição, carga, transporte, espalhamento de material e compactação, a TDEC entende que esses impactos devem ser objeto de alinhamento entre as partes. FERROVIA DE INTEGRAÇÃO DO CENTRO-OESTE – FICO – LOTES 09 E 10 - VA"},{"ref":"SOLOS PARA ATERROS","tipo":"desvio","tema":"Prazo e licenças","desc":"O presente orçamento não contempla a aquisição de solos para execução de aterros e demais aplicações que demandem o uso de solo. Assim, esta proposta considera que todos os solos de aterro utilizados na obra serão integralmente provenientes das escavações obrigatórias previstas nas áreas de empréstimo lateral. Adicionalmente, considera-se que todos os solos destinados a essas finalidades apresentarão competência e qualidade adequadas às respectivas aplicações, isto é, no momento em que forem escavados. Dessa forma, caso os solos locais não apresentem as caracterisiticas necessárias para sua ap"},{"ref":"RETENÇÃO CMS E RT","tipo":"desvio","tema":"Prazo e licenças","desc":"Não consideramos a aplicação de retenções, glosas e/ou penalização na medição dos serviços, seja por aplicação de Check-Lists de QSSMA, entregáveis, alterações em prazo ou avaliações mensais, dessa forma, propomos desvio ao citado nos documentos RT-1000FE-B-500018 e CM-1000FE-B-500004 sobre o tema. Como exemplos: CMS C.25.55.000 - 30% RETENÇÃO - REGULARIZAÇÃO E COMPACTAÇÃO DE PLATAFORMA CMS C.25.50.000 - 10% RETENÇÃO - ESCAVAÇÃO, CARGA, TRANSPORTE, DESCARGA E ESPALHAMENTO DE SOLO OU ROCHA – TERRAPLENAGEM CMS C.25.80.000 - 10% RETENÇÃO - COMPACTAÇÃO DE ATERRO"},{"ref":"MANUTENÇÃO DE ACESSOS","tipo":"desvio","tema":"Prazo e licenças","desc":"Não consideramos em nossos custos a manutenção do acesso entre os munícipios de Nova Nazare-MT, Cocalinho/MT, Água Boa/MT até as frentes obra, visto que são estradas rurais existentes de domínio público. Os recursos foram dimensionados considerando apenas a manutenção dos acessos internos da obra."},{"ref":"ESCORAMENTO DE CAVAS E VALAS","tipo":"desvio","tema":"Prazo e licenças","desc":"A presente proposta não considera a utilização de blindagem e escoramento continuos e descontinuos das escavações de cavas, valas e demais escavações previstas na obra. Quando necessário, a presente proposta considera que as escavações, quando necessários, terão suas larguras aumentadas com a inclinação necessária para garantir a segurança das execuções e estes volumes acrescidos serão medidos nos itens de escavação já previtos na QQP. 12 INTERVENÇÃO NA PONTE EXSISTENTE No acesso localizado no km 311+600, foi identificada a existência de uma ponte com seção transversal reduzida, apresentando p"}]},"Mota-Engil":{"total":14,"desvios":1,"premissas":13,"porTema":{"Geotecnia":1,"Prazo e licenças":11,"Preço e reajuste":2},"lista":[{"ref":"1572FE-C-500228_Rev_2.dwg e PQ-1000FE-B-500029_REV 0 - 29_05_26.xlsx","tipo":"desvio","tema":"Geotecnia","desc":"A nossa proposta não considera a execução da impermeabilização descrita no documento \"1572FE-C-500228_Rev_2.dwg\" que considera a execução de 5 camadas de impermeabilização do tabuleiro do trecho navegávem da ponte Rio das Mortes: - Camada de imprimação: solução betuminosa de espessura de 5 mm ou primer de manta asfáltica; - Camada de berço: membrana de betume-polimérico (APP ou CBC), ou manta asfáltica (para o caso de uso de primer na camada 2), entre 3 mm e 5 mm, aproximadamente; - Camada separadora: filme polietileno ou papel kraft betumado, com 5 mm; - Camada de proteção mecânica: concreto "},{"ref":"","tipo":"premissa","tema":"Prazo e licenças","desc":"Conforme orientação da VALE, quando houver situação extraordinária não mapeada em projeto (serviços omissos da planilha de quantidades, condições de trabalho diferentes, alterações em projetos, etc.) trataremos, de forma antecipada, com a fiscalização e ATO os seus impactos."},{"ref":"","tipo":"premissa","tema":"Preço e reajuste","desc":"Os serviços de terraplenagem e fundações foram orçados com base nos relatórios geotécnicos fornecidos. Caso sejam identificadas em campo condições de solo mole, lençol freático superficial, presença de matacões ou qualquer outra condição geotécnica mais desfavorável do que a documentada nos projetos, tais ocorrências serão consideradas como fato gerador de reequilíbrio econômico-financeiro e extensão de prazo, nos termos da legislação aplicável, independentemente da previsão de itens específicos na Planilha de Quantidades."},{"ref":"","tipo":"premissa","tema":"Prazo e licenças","desc":"A MOTA-ENGIL BRASIL declara que não foram considerados aterros de sobrecarga, drenos verticais, colunas de brita ou outras técnicas de aceleração de recalque, por não terem sido identificados nos projetos."},{"ref":"","tipo":"premissa","tema":"Prazo e licenças","desc":"O planejamento e os prazos propostos consideram a disponibilidade integral e ininterrupta da faixa de domínio e das áreas de empréstimo, com todas as licenças ambientais (LI, ASV) e desapropriações concluídas até a data da Ordem de Serviço."},{"ref":"","tipo":"premissa","tema":"Prazo e licenças","desc":"A responsabilidade da MOTA-ENGIL BRASIL sobre caminhos de serviço limita-se àqueles por ela implantados e informados na proposta técnica. A manutenção e recomposição de estradas vicinais utilizadas durante a obra, mas não construídas pela MOTA ENGIL, serão de responsabilidade da VALE, salvo se os danos decorrerem de comprovada negligência da MOTA ENGIL."},{"ref":"","tipo":"premissa","tema":"Preço e reajuste","desc":"A Proposta contempla recursos para plano de chuvas com base nas médias históricas da região. Índices pluviométricos que excedam em 20% (vinte por cento) a média histórica mensal, ou que causem paralisação comprovada das frentes de serviço por mais de 5 (cinco) dias consecutivos, serão tratados como evento extraordinário, com direito a prorrogação de prazo."},{"ref":"","tipo":"premissa","tema":"Prazo e licenças","desc":"Não consideramos em nossa proposta nenhum serviço de rebaixamento de lençol citado no \"DT-15221FE-X-500001\", pois não está previsto na PQ, bem como em outras áreas da obra onde ocorra manifestação de água do lençol freático interferindo com os serviços previstos."},{"ref":"","tipo":"premissa","tema":"Prazo e licenças","desc":"Não consideramos em nossa proposta a execução de quaisquer estacas de sacrifício para as provas de carga previstas na PQ."},{"ref":"","tipo":"premissa","tema":"Prazo e licenças","desc":"Para a Ponte do Rio das Mortes não estamos alterando a infra e mesoestruturas das pontes consequentemente mantivemos as quantidades de estacas e estruturas de concreto da proposta básica (concreto, forma, armação, etc.) pois os novos cálculos estruturais para estas estruturas serão desenvolvidos após a assinatura do contrato juntamente com o projeto alternativo da estrutura metálica da ponte."},{"ref":"","tipo":"premissa","tema":"Prazo e licenças","desc":"Para viabilização do lançamento da estrutura metálica na opção alternativa, estamos agregando 2 apoios centrais dentro do curso d’água (e estimamos todos os seus quantitativos) e tais apoios serão removidos e destinados a bota fora aprovado ao término da sua construção."},{"ref":"","tipo":"premissa","tema":"Prazo e licenças","desc":"De acordo com a PQ da VALE, os encontros E1 e E2 e os pilares P1 e P6 tem previsão de quantitativos para uso de camisas metálicas provisórias ou temporárias. Entretanto, devido a necessidade de pinar as estacas na rocha, somente será possível executá-las através da metodologia com circulação reversa e com o uso de camisas metálicas agregadas as estacas."},{"ref":"","tipo":"premissa","tema":"Prazo e licenças","desc":"Em relação aos riscos hidrológicos para a execução das pontes, consideramos que no período seco, não ocorrerá eventos que causem subida dos níveis d’água acima das Médias de Longo Termo (MLT) descritas nos documentos e projetos entregues pela Vale. Esta cota, visa a segurança dos aterros de conquista contra cheias no período de Abril a outubro e execução dos serviços nas pontes definidas no escopo contratual. Caso ocorram eventos desta natureza que impossibilite a execução dos serviços previstos nas pontes, haverá necessidade de negociações entre as partes."},{"ref":"","tipo":"premissa","tema":"Prazo e licenças","desc":"A validação de nossa proposta alternativa para a ponte do Rio das Mortes estará sujeita à aprovação da revisão da licença ambiental considerando as nossas alterações propostas no projeto executivo da VALE, sendo que a VALE e a Contratada deverão juntar esforços para esta rápida aprovação. Para que não haja impactos relacionados aos prazos no cronograma apresentado pela Vale para a Ponte do Rio das Mortes, previmos que as aprovações do projeto executivo da proposta alternativa deverá atender a data limite de 26/04/2027. Esta data define o marco sem afetar o planejamento apresentado para a execu"}]},"Ápia":{"total":8,"desvios":0,"premissas":8,"porTema":{"Prazo e licenças":8},"lista":[{"ref":"RT-1000FE-B-500018","tipo":"premissa","tema":"Prazo e licenças","desc":"Informamos que estamos estudando uma proposta alternativa para a execução da Ponte sobre o Rio das Mortes, a qual se encontra em desenvolvimento técnico. Adicionalmente, estão avaliando possíveis sinergias de recursos com os contratos vigentes."},{"ref":"RT-1000FE-B-500018","tipo":"premissa","tema":"Prazo e licenças","desc":"Estamos considerando que a Ordem de Serviço será emitida em janeiro/2027, estando todos os projetos executivos detalhados concluídos e fornecidos pela VALE em suas versões finais e, com frente ininterrupta para a execução dos serviços."},{"ref":"RT-1000FE-B-500018","tipo":"premissa","tema":"Prazo e licenças","desc":"Todas as licenças ambientais necessárias a execução dos serviços, jazidas, áreas de empréstimos, outorga de água, areal e ADME deverão estar contempladas na licença ambiental do projeto, documentos de responsabilidade única e exclusiva da VALE."},{"ref":"RT-1000FE-B-500018","tipo":"premissa","tema":"Prazo e licenças","desc":"Estamos considerando que após entrega dos projetos completos, em suas versões finais, será feito um cronograma detalhado que será aprovado pelas partes, para definição do marcos contratuais. O cronograma será apresentado em até 30 (trinta) dias após a emissão da OS."},{"ref":"RT-1000FE-B-500018","tipo":"premissa","tema":"Prazo e licenças","desc":"Consideramos que os canteiros avançados serão implantados dentro da faixa de domínio."},{"ref":"RT-1000FE-B-500018","tipo":"premissa","tema":"Prazo e licenças","desc":"Ressaltamos que caso ocorra necessidade de retirada e deslocamentos de interferências, tais como: redes elétricas, mata-burros, porteiras, barragens e desvios provisórios, estes serviços deverão ser remunerados conforme itens de PQ e/ou OIN."},{"ref":"RT-1000FE-B-500018","tipo":"premissa","tema":"Prazo e licenças","desc":"Já consideramos as condições de Área Não Controlada para elaboração de nossa proposta."},{"ref":"RT-1000FE-B-500018","tipo":"premissa","tema":"Prazo e licenças","desc":"Considerams em nossa proposta os projetos DNIT da ultima revisão valida, \"Dispositivos DNIT - Utilizado EMENDA 2 da Publicação IPR – 736, 5ª edição, 2018\""}]}},"vertical":{"Aterpa":{"totalAval":351,"comSub":293,"semRecurso":79,"pctSemRecurso":22.507122507122507,"classeA":[{"item":"1.1.3.1.2.1","desc":"Corte com destocamento de árvores com Ø > 30cm e remoção par","qtd":980,"un":"un"},{"item":"1.1.10.1.1.1","desc":"Revestimento vegetal por hidrossemeadura, com coveamento e c","qtd":327345.62,"un":"m2"},{"item":"3.3.1.2.1.1","desc":"Corte com destocamento de árvores com Ø > 30cm e remoção par","qtd":5550,"un":"un"},{"item":"3.3.8.1.1.1","desc":"Revestimento vegetal por hidrossemeadura, com coveamento e c","qtd":173187.48,"un":"m2"},{"item":"4.4.10.1.1.1","desc":"Fornecimento e transporte de estrutura em perfis metálicos p","qtd":1504.85,"un":"t"},{"item":"4.4.10.3.1.1","desc":"Fornecimento, transporte e montagem de de hastes para tirant","qtd":515.78,"un":"t"}]},"Consag":{"totalAval":21,"comSub":0,"semRecurso":0,"pctSemRecurso":0,"classeA":[]},"Empa/TDEC":{"totalAval":341,"comSub":282,"semRecurso":81,"pctSemRecurso":23.75366568914956,"classeA":[{"item":"1.1.3.1.1.3","desc":"Supressão vegetal, destocamento e limpeza de árvores, arbust","qtd":1604437.82,"un":"m2"},{"item":"1.1.3.1.2.1","desc":"Corte com destocamento de árvores com Ø > 30cm e Fornecimento, transporte e montagem de de hastes para tirante MACALLOY M110, fy = 460 MPa, fu = 610 MPa","un":"t","qtd":515.78,"itens":1}]},"Empa/TDEC":{"cob":185,"pctServicos":94.87179487179486,"pctQtd":99.94191884717063,"descobertosA":[{"desc":"Fornecimento, transporte e montagem de de hastes para tirante MACALLOY M110, fy = 460 MPa, fu = 610 MPa","un":"t","qtd":515.78,"itens":1}]},"Mota-Engil":{"cob":194,"pctServicos":99.48717948717949,"pctQtd":99.99993220071971,"descobertosA":[]},"Ápia":{"cob":112,"pctServicos":57.43589743589743,"pctQtd":81.83520869861165,"descobertosA":[{"desc":"Supressão vegetal com destocamento de vegetação com Ø =< 30cm com remoção para a área de depósito - DMT até 1000m","un":"m2","qtd":261200.9,"itens":2},{"desc":"Supressão vegetal, destocamento e limpeza de árvores, arbustos, vegetação rasteira e entulhos com remoção para área de depósito - DMT até 350m","un":"m2","qtd":2055554.24,"itens":2},{"desc":"Cerca de arame galvanizado malha (2cm) com mourões de concreto - Padrão VALEC para Direcionamento de Animais nas Passagens de Fauna","un":"m","qtd":5286.54,"itens":2},{"desc":"Armadura em aço CA-50, fornecimento, corte, dobra e aplicação - qualquer diâmetro","un":"kg","qtd":545252.5599999999,"itens":13},{"desc":"JUNTA COM MASTIQUE ELÁSTICO/ CORDA ALCATROADA/ POLIURETANO","un":"dm³","qtd":561.6,"itens":1},{"desc":"Fornecimento, transporte e montagem de de hastes para tirante MACALLOY M110, fy = 460 MPa, fu = 610 MPa","un":"t","qtd":515.78,"itens":1}]}}}}};
</script>
<script>
/* FICO — Análise Técnica de Propostas · Pacotes 09 e 10
   Aplicação local, autocontida. Dados pré-extraídos em dados.js. */

const $ = s => document.querySelector(s);
const D = DADOS;
const PR = D.proponentes;
const DIMS = D.dimensoes;

const fmt = (n, d = 0) => (n === null || n === undefined || !isFinite(n)) ? '—'
  : Number(n).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const classeNota = n => n >= 70 ? 'n-alto' : n >= 50 ? 'n-medio' : 'n-baixo';
const nota = n => `<span class="nota ${classeNota(n)}">${fmt(n, 1)}</span>`;

/* ---------- pesos ---------- */
const PESOS = {};
DIMS.forEach(d => PESOS[d.chave] = d.pesoPadrao);

const PRESETS = {
  'Equilibrado': { conformidade: 20, cpu: 28, prazo: 20, recursos: 17, capacidade: 15 },
  'Foco em prazo': { conformidade: 15, cpu: 20, prazo: 38, recursos: 17, capacidade: 10 },
  'Foco em CPU': { conformidade: 15, cpu: 45, prazo: 15, recursos: 15, capacidade: 10 },
  'Foco em capacidade': { conformidade: 18, cpu: 20, prazo: 15, recursos: 15, capacidade: 32 },
  'Rigor documental': { conformidade: 40, cpu: 25, prazo: 15, recursos: 10, capacidade: 10 },
};
let presetAtivo = 'Equilibrado';

function calcular() {
  const soma = Object.values(PESOS).reduce((a, b) => a + b, 0) || 1;
  return PR.map(p => ({
    ...p,
    total: DIMS.reduce((s, d) => s + p.dimensoes[d.chave].nota * PESOS[d.chave], 0) / soma,
  })).sort((a, b) => b.total - a.total);
}

/* ---------- gráficos (SVG puro) ---------- */
function barrasV(series, labels, cores, alt = 210, unidade = '') {
  const larg = 780, padL = 46, padB = 30, padT = 12;
  const max = Math.max(...series.flat().filter(v => isFinite(v)), 1);
  const nG = labels.length;
  const passo = (larg - padL - 12) / nG;
  const bw = Math.min(passo / (series.length + 1), 26);
  let g = '';
  for (let t = 0; t <= 4; t++) {
    const y = padT + (alt - padT - padB) * (1 - t / 4);
    g += `<line class="grid-l" x1="${padL}" y1="${y}" x2="${larg}" y2="${y}"/>`
      + `<text class="gy" x="${padL - 7}" y="${y + 3}" text-anchor="end">${fmt(max * t / 4)}</text>`;
  }
  series.forEach((serie, si) => {
    serie.forEach((v, i) => {
      if (!isFinite(v)) return;
      const h = (alt - padT - padB) * (v / max);
      const x = padL + i * passo + (passo - bw * series.length) / 2 + si * bw;
      g += `<rect x="${x}" y="${padT + (alt - padT - padB) - h}" width="${bw - 2}" height="${Math.max(h, 0)}" fill="${cores[si]}" rx="2"><title>${esc(labels[i])}: ${fmt(v)} ${unidade}</title></rect>`;
    });
  });
  labels.forEach((l, i) => {
    g += `<text class="gx" x="${padL + i * passo + passo / 2}" y="${alt - padB + 15}" text-anchor="middle">${esc(l)}</text>`;
  });
  return `<svg viewBox="0 0 ${larg} ${alt}" role="img">${g}</svg>`;
}

function linhas(series, cores, nomes, alt = 250) {
  const larg = 820, padL = 44, padB = 28, padT = 12;
  const maxX = Math.max(...series.map(s => s.length), 1);
  const maxY = Math.max(...series.flat().filter(v => isFinite(v)), 1);
  const px = i => padL + (larg - padL - 10) * (i / Math.max(maxX - 1, 1));
  const py = v => padT + (alt - padT - padB) * (1 - v / maxY);
  let g = '';
  for (let t = 0; t <= 4; t++) {
    const y = padT + (alt - padT - padB) * (1 - t / 4);
    g += `<line class="grid-l" x1="${padL}" y1="${y}" x2="${larg}" y2="${y}"/>`
      + `<text class="gy" x="${padL - 7}" y="${y + 3}" text-anchor="end">${fmt(maxY * t / 4)}</text>`;
  }
  for (let m = 0; m < maxX; m += 3) {
    g += `<text class="gx" x="${px(m)}" y="${alt - padB + 15}" text-anchor="middle">${m + 1}</text>`;
  }
  series.forEach((s, si) => {
    if (!s || !s.length) return;
    const d = s.map((v, i) => `${i ? 'L' : 'M'}${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(' ');
    g += `<path d="${d}" fill="none" stroke="${cores[si]}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const iMax = s.indexOf(Math.max(...s));
    g += `<circle cx="${px(iMax)}" cy="${py(s[iMax])}" r="3.6" fill="${cores[si]}"><title>${esc(nomes[si])} — pico ${fmt(s[iMax])} no mês ${iMax + 1}</title></circle>`;
  });
  g += `<text class="gx" x="${larg / 2}" y="${alt - 2}" text-anchor="middle">mês do contrato</text>`;
  return `<svg viewBox="0 0 ${larg} ${alt}" role="img">${g}</svg>`;
}

function radar(p, tam = 220) {
  const c = tam / 2, raio = c - 34, n = DIMS.length;
  const ang = i => (Math.PI * 2 * i / n) - Math.PI / 2;
  let g = '';
  [0.25, 0.5, 0.75, 1].forEach(f => {
    const pts = DIMS.map((_, i) => `${c + Math.cos(ang(i)) * raio * f},${c + Math.sin(ang(i)) * raio * f}`).join(' ');
    g += `<polygon points="${pts}" fill="none" stroke="#E4EBEF" stroke-width="1"/>`;
  });
  const pts = DIMS.map((d, i) => {
    const v = p.dimensoes[d.chave].nota / 100;
    return `${c + Math.cos(ang(i)) * raio * v},${c + Math.sin(ang(i)) * raio * v}`;
  }).join(' ');
  g += `<polygon points="${pts}" fill="${p.cor}22" stroke="${p.cor}" stroke-width="2"/>`;
  DIMS.forEach((d, i) => {
    const x = c + Math.cos(ang(i)) * (raio + 16), y = c + Math.sin(ang(i)) * (raio + 16);
    const a = Math.abs(Math.cos(ang(i))) < 0.3 ? 'middle' : (Math.cos(ang(i)) > 0 ? 'start' : 'end');
    g += `<text class="gx" x="${x}" y="${y + 3}" text-anchor="${a}">${esc(d.nome.split(' ')[0])}</text>`;
  });
  return `<svg viewBox="0 0 ${tam} ${tam}" role="img">${g}</svg>`;
}

/* ---------- telas ---------- */
const TELAS = [];
const T = (id, titulo, curto, render) => TELAS.push({ id, titulo, curto, render });

/* 1. Ranking */
T('ranking', 'Ranking técnico', 'Ranking', () => {
  const r = calcular();
  const lider = r[0], seg = r[1];
  const dif = lider.total - seg.total;
  return `
  <div class="head">
    <p class="eyebrow">Resultado consolidado</p>
    <h1>Ranking técnico das proponentes.</h1>
    <p>Nota ponderada 0–100 sobre ${DIMS.length} dimensões, calculada a partir de indicadores extraídos
       dos ${fmt(PR.reduce((s, p) => s + p.arquivos, 0))} arquivos entregues. Ajuste os pesos e o ranking recalcula.</p>
  </div>

  <div class="destaque">
    <span class="pill">Recomendação técnica</span>
    <h2>${esc(lider.nome)} lidera com ${fmt(lider.total, 1)} pontos.</h2>
    <p>${dif < 4
      ? `Vantagem estreita de ${fmt(dif, 1)} ponto(s) sobre ${esc(seg.nome)} — o resultado é sensível aos pesos. Recomenda-se decidir com base na dimensão mais crítica para a obra e levar as duas a esclarecimento.`
      : `Vantagem de ${fmt(dif, 1)} pontos sobre ${esc(seg.nome)}, consistente na maioria das configurações de peso.`}</p>
  </div>

  <div class="sec"><h2>Classificação</h2><span>peso configurável abaixo</span></div>
  <div class="rank">
    ${r.map((p, i) => `
      <div class="rk ${i === 0 ? 'lider' : ''}" style="--c:${p.cor}">
        <div class="pos">${i + 1}</div>
        <div><div class="nm">${esc(p.nome)}</div><div class="rz">${esc(p.razao)}</div></div>
        <div class="bar"><i style="width:${p.total}%"></i></div>
        <div class="sc" style="color:${p.cor}">${fmt(p.total, 1)}</div>
      </div>`).join('')}
  </div>

  <div class="sec"><h2>Pesos da avaliação</h2><span>somam ${fmt(Object.values(PESOS).reduce((a, b) => a + b, 0))}%</span></div>
  <div class="card pad">
    <div class="presets" id="presets">
      ${Object.keys(PRESETS).map(k => `<button class="chip ${k === presetAtivo ? 'on' : ''}" data-preset="${esc(k)}">${esc(k)}</button>`).join('')}
    </div>
    <div class="pesos" style="margin-top:18px">
      ${DIMS.map(d => `
        <div class="peso">
          <label for="w-${d.chave}">${esc(d.nome)}</label>
          <input type="range" id="w-${d.chave}" min="0" max="50" step="1" value="${PESOS[d.chave]}" data-w="${d.chave}">
          <output for="w-${d.chave}">${PESOS[d.chave]}%</output>
        </div>`).join('')}
    </div>
  </div>

  <div class="sec"><h2>Matriz por dimensão</h2><span>nota 0–100 em cada eixo</span></div>
  <div class="wrap card">
    <table class="mx">
      <thead><tr><th>Proponente</th>${DIMS.map(d => `<th class="num">${esc(d.nome)}</th>`).join('')}<th class="num">Total</th></tr></thead>
      <tbody>
        ${r.map(p => `<tr>
          <td><span style="color:${p.cor}">●</span> ${esc(p.nome)}</td>
          ${DIMS.map(d => `<td class="num">${nota(p.dimensoes[d.chave].nota)}</td>`).join('')}
          <td class="num"><b>${fmt(p.total, 1)}</b></td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>

  <div class="sec"><h2>Perfil de cada proponente</h2><span>forma do polígono revela o equilíbrio</span></div>
  <div class="grid g3">
    ${r.map(p => `<div class="card pad" style="text-align:center">
      <div style="font-weight:800;color:${p.cor};margin-bottom:4px">${esc(p.nome)}</div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:8px">${fmt(p.total, 1)} pontos</div>
      ${radar(p)}
    </div>`).join('')}
  </div>`;
});

/* 2. Dimensões */
T('dimensoes', 'Dimensões e indicadores', 'Dimensões', () => {
  const r = calcular();
  return `
  <div class="head">
    <p class="eyebrow">Detalhamento</p>
    <h1>De onde vem cada nota.</h1>
    <p>Cada dimensão abre os indicadores objetivos que a compõem e as penalidades aplicadas.
       Toda penalidade tem origem verificável no documento entregue.</p>
  </div>
  ${r.map(p => `
    <div class="sec"><h2 style="color:${p.cor}">${esc(p.nome)}</h2><span>${fmt(p.total, 1)} pontos · ${esc(p.razao)}</span></div>
    <div class="grid g2">
      ${DIMS.map(d => {
    const x = p.dimensoes[d.chave];
    return `<details class="dim">
          <summary><span>${esc(x.nome)}</span> ${nota(x.nota)}</summary>
          <div class="body">
            <dl class="ind">
              ${Object.entries(x.ind).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}
            </dl>
            ${x.penalidades && x.penalidades.length ? `<div class="pen">
              ${x.penalidades.map(pe => `<div><span>${esc(pe.t)}</span><b>${fmt(pe.v, 1)}</b></div>`).join('')}
            </div>` : '<div class="pen"><div style="color:var(--ok)"><span>Sem penalidades nesta dimensão</span><b>0</b></div></div>'}
          </div>
        </details>`;
  }).join('')}
    </div>`).join('')}`;
});

/* 3. CPUs e Curva ABC */
T('cpu', 'CPUs e curva ABC', 'CPUs & ABC', () => {
  const r = calcular();
  const nomes = r.map(p => p.nome), cores = r.map(p => p.cor);
  const A = D.abc.resumo;
  return `
  <div class="head">
    <p class="eyebrow">Núcleo da análise</p>
    <h1>Composições de preços e concentração de escopo.</h1>
    <p>Como todas as proponentes devolveram a planilha de quantidades <b>sem alteração</b>, o quantitativo
       não diferencia ninguém. O mérito técnico está em <b>como cada uma compõe seus recursos</b> —
       sobretudo nos ${A.A} itens classe A, que concentram o esforço da obra.</p>
  </div>

  <div class="aviso">
    <b>Quantitativos idênticos entre todas as proponentes</b>
    As ${fmt(D.base.mediveis)} linhas medíveis da planilha ${esc(D.base.pq)} foram devolvidas com quantidades
    exatamente iguais à base — zero divergência entre Ápia, Mota-Engil e Consag. Aterpa e Empa/TDEC não
    devolveram a planilha (T.01). Portanto a comparação de quantidades vale como <b>conformidade</b>, não como mérito.
  </div>

  <div class="sec"><h2>Curva ABC da base</h2><span>relevância física por família de unidade</span></div>
  <div class="grid g3">
    <div class="kpi"><span>Classe A</span><strong style="color:var(--risk)">${A.A}</strong><em>itens que concentram o esforço — ${fmt(A.A / (A.A + A.B + A.C) * 100, 1)}% do total</em></div>
    <div class="kpi"><span>Classe B</span><strong style="color:var(--warn)">${A.B}</strong><em>relevância intermediária</em></div>
    <div class="kpi"><span>Classe C</span><strong style="color:var(--neutro)">${A.C}</strong><em>cauda longa de baixo impacto</em></div>
  </div>

  <div class="sec"><h2>Profundidade das CPUs</h2><span>composições entregues e produtivas</span></div>
  <div class="card pad">
    <div class="legenda">
      <span><i style="background:var(--fico)"></i>Composições entregues</span>
      <span><i style="background:var(--laranja)"></i>Com recursos próprios (equip. + MO)</span>
    </div>
    ${barrasV(
    [r.map(p => p.cpu.total || 0), r.map(p => p.cpu.produtivas || 0)],
    nomes, ['#2876B9', '#F6A01A'], 210, 'composições')}
  </div>

  <div class="sec"><h2>Comparativo de composições</h2><span>o modelo aninhado foi resolvido um nível abaixo</span></div>
  <div class="wrap card">
    <table>
      <thead><tr>
        <th>Proponente</th><th class="num">Composições</th><th class="num">Auxiliares</th>
        <th class="num">Com recursos</th><th class="num">Delegadas</th><th class="num">Declaram produção</th>
        <th>Formato</th><th>Rastreável à EAP</th>
      </tr></thead>
      <tbody>${r.map(p => {
      const c = p.cpu;
      return `<tr>
          <td><span style="color:${p.cor}">●</span> <b>${esc(p.nome)}</b></td>
          <td class="num">${fmt(c.total)}</td>
          <td class="num">${c.auxiliares === null ? '—' : fmt(c.auxiliares)}</td>
          <td class="num">${c.produtivas === null ? '—' : fmt(c.produtivas)}</td>
          <td class="num">${c.delegadas === null ? '—' : fmt(c.delegadas)}</td>
          <td class="num">${c.comProducao === null ? '—' : fmt(c.comProducao)}</td>
          <td>${c.formato === 'planilha' ? '<span class="tag ok"><i></i>Planilha</span>' : '<span class="tag risk"><i></i>Somente PDF</span>'}</td>
          <td>${c.rastreavel ? '<span class="tag ok"><i></i>Sim</span>' : '<span class="tag warn"><i></i>Numeração própria</span>'}</td>
        </tr>`;
    }).join('')}</tbody>
    </table>
  </div>

       depois, em aditivo. Aqui as horas de equipamento exigidas pelas composições são confrontadas com
       a frota que a própria empresa declarou na planilha de diesel.</p>

/* 7. Frota e produtividade — explosão máquina a máquina */
T('frota', 'Frota e produtividade', 'Frota', () => {
  const F = A().frotaItem;
  const ordem = ['Aterpa', 'Ápia', 'Mota-Engil', 'Empa/TDEC', 'Consag'];
  const pos = p => p === 'ok' ? '<span class="tag ok"><i></i>dentro da faixa</span>'
    : p === 'lento' ? '<span class="tag risk"><i></i>lento</span>'
      : p === 'otimista' ? '<span class="tag warn"><i></i>otimista</span>' : '<span class="tag neu"><i></i>—</span>';

  return `
  <div class="head">
    <p class="eyebrow">Camada mais profunda</p>
    <h1>Frota máquina a máquina.</h1>
    <p>Nos dois serviços que mais pesam na obra, a árvore de composições foi percorrida até a folha:
       cada equipamento com sua quantidade, seu fator de utilização e sua contribuição em hora por
       unidade. Isso permite separar as três causas possíveis da dispersão — <b>porte do equipamento,
       número de turnos e distância de transporte</b>.</p>
  </div>

  <div class="aviso">
    <b>A distância de transporte não é premissa livre</b>
    A base fixa <b>“DMT até 1.000 m”</b> no item de escavação, e o transporte além disso é pago à parte,
    no item de momento extraordinário (5,86 milhões de m³×km). Todas as proponentes deveriam, portanto,
    precificar o mesmo percurso. O porte dos equipamentos também é equivalente entre elas — caminhão de
    16 m³ na Mota-Engil e na Empa/TDEC, 28 a 30 t na Aterpa e na Ápia. E o número de turnos não interfere,
    porque hora-por-m³ é uma medida neutra a jornada. Sobrando essas três, o que resta explicando a
    diferença é <b>premissa de produtividade</b>.
  </div>

  ${Object.entries(F.itens).map(([item, d]) => {
    const props = ordem.filter(p => d.proponentes[p]);
    return `
    <div class="sec"><h2><span class="mono" style="font-size:14px;color:var(--muted)">${esc(item)}</span> — ${esc(d.desc.slice(0, 62))}</h2>
      <span>${fmt(d.qtd)} ${esc(d.un)}${d.dmtFixo ? ' · DMT fixado em ' + esc(d.dmtFixo) : ''}</span></div>

    <div class="wrap card">
      <table><thead><tr>
        <th>Família de equipamento</th>
        ${props.map(p => `<th class="num" style="color:${CORP[p]}">${esc(p)}</th>`).join('')}
        <th class="num">Referência física</th>
      </tr></thead>
      <tbody>
        ${d.familias.map(fam => `<tr>
          <td><b>${esc(fam.nome)}</b><div style="font-size:11px;color:var(--muted);font-weight:400">${esc(fam.nota)}</div></td>
          ${props.map(p => {
      const g = d.proponentes[p].grupos[fam.nome];
      if (!g || !g.relevante) return '<td class="num" style="color:var(--muted)">—</td>';
      const fora = g.posicao !== 'ok';
      return `<td class="num" style="font-weight:${fora ? 800 : 600};color:${g.posicao === 'lento' ? 'var(--risk)' : g.posicao === 'otimista' ? 'var(--warn)' : 'var(--ink)'}">${fmt(g.produtividade, 0)}</td>`;
    }).join('')}
          <td class="num" style="color:var(--muted)">${fmt(fam.lo)}–${fmt(fam.hi)}</td>
        </tr>`).join('')}
        <tr style="background:var(--soft)">
          <td><b>Total do item</b><div style="font-size:11px;color:var(--muted);font-weight:400">equipamento-hora por ${esc(d.un)}</div></td>
          ${props.map(p => `<td class="num"><b>${fmt(d.proponentes[p].total, 4)}</b></td>`).join('')}
          <td></td>
        </tr>
        <tr>
          <td style="color:var(--muted)">Turnos declarados</td>
          ${props.map(p => `<td class="num">${d.proponentes[p].turnos}</td>`).join('')}
          <td></td>
        </tr>
      </tbody></table>
    </div>
    <p style="font-size:12px;color:var(--muted);margin-top:8px">Valores em <b>m³ por equipamento-hora</b>:
      quanto maior, mais produtiva a premissa. Famílias com menos de 3% das horas do item foram omitidas,
      porque frações de hora distorcem o rendimento implícito.</p>

    <div class="sec" style="margin-top:26px"><h2>Posição contra a referência</h2><span>onde cada premissa cai</span></div>
    <div class="wrap card">
      <table><thead><tr><th>Família</th>${props.map(p => `<th style="color:${CORP[p]}">${esc(p)}</th>`).join('')}</tr></thead>
        <tbody>${d.familias.map(fam => `<tr>
          <td><b>${esc(fam.nome)}</b></td>
          ${props.map(p => {
      const g = d.proponentes[p].grupos[fam.nome];
      return `<td>${g && g.relevante ? pos(g.posicao) : '<span style="color:var(--muted)">—</span>'}</td>`;
    }).join('')}
        </tr>`).join('')}</tbody></table>
    </div>

    <div class="sec" style="margin-top:26px"><h2>Equipamentos declarados</h2><span>o que cada uma coloca no serviço</span></div>
    ${props.map(p => {
      const x = d.proponentes[p];
      const grupos = Object.entries(x.grupos).filter(([, g]) => g.relevante).sort((a, b) => b[1].h - a[1].h);
      return `<details class="dim" style="margin-bottom:9px">
        <summary><span style="color:${CORP[p]}">${esc(p)}</span>
          <span class="tag neu">${fmt(x.total, 4)} eq-h/${esc(d.un)} · ${x.turnos} turno(s)${x.producao ? ' · produção ' + fmt(x.producao, 2) : ''}</span></summary>
        <div class="body">
          ${grupos.map(([k, g]) => `
            <div style="margin-bottom:14px">
              <div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;color:var(--fico-deep);margin-bottom:5px">
                <span>${esc(k)}</span><span>${fmt(g.h, 4)} eq-h/${esc(d.un)} · ${fmt(g.pct, 0)}%</span></div>
              <div class="wrap"><table>
                <thead><tr><th>Equipamento</th><th class="num">Quant.</th><th class="num">Utilização</th><th class="num">eq-h/${esc(d.un)}</th><th>Porte</th><th>Turnos</th></tr></thead>
                <tbody>${g.itens.map(i => `<tr>
                  <td>${esc(i.nome)}</td>
                  <td class="num">${fmt(i.q, i.q < 10 ? 3 : 0)}</td>
                  <td class="num">${fmt(i.u, 3)}</td>
                  <td class="num">${i.h < 0.001 ? i.h.toExponential(1) : fmt(i.h, 5)}</td>
                  <td>${i.porte ? `<span class="tag neu">${esc(i.porte)}</span>` : '—'}</td>
                  <td>${i.turnos > 1 ? '<span class="tag warn"><i></i>2</span>' : '1'}</td>
                </tr>`).join('')}</tbody>
              </table></div>
            </div>`).join('')}
        </div>
      </details>`;
    }).join('')}`;
  }).join('')}

  <div class="sec"><h2>Momento extraordinário de transporte</h2><span>aqui a distância é a variável</span></div>
  <div class="card pad">
    <p style="margin:0 0 14px;font-size:13.5px;color:var(--muted)">
      ${esc(F.momento.desc)} — <b>${fmt(F.momento.qtd)} ${esc(F.momento.un)}</b>.
      Diferente do item anterior, aqui o percurso é justamente o que se paga, então a dispersão reflete
      premissa de velocidade média e de aproveitamento de carga.</p>
    <div class="wrap">
      <table><thead><tr><th>Proponente</th><th class="num">eq-h por m³×km</th><th class="num">Eq-h no item</th><th>Posição</th></tr></thead>
        <tbody>${F.momento.valores.map(v => `<tr>
          <td><span style="color:${CORP[v.p]}">●</span> <b>${esc(v.p)}</b></td>
          <td class="num">${v.v.toExponential(2)}</td>
          <td class="num">${fmt(v.total)}</td>
          <td>${pos(v.posicao === 'conservador' ? 'lento' : v.posicao)}</td>
        </tr>`).join('')}</tbody></table>
    </div>
    <p style="margin:14px 0 0;font-size:12px;color:var(--muted)">

      — ${esc(F.momento.ref.nota)}.</p>
  </div>`;
});

  const chip = s => `<span class="tag ${SIT[s][0]}"><i></i>${SIT[s][1]}</span>`;

  return `
  <div class="head">
    <p class="eyebrow">Pacotes 9 e 10 · três pontes ferroviárias</p>
    <h1>Obras de arte especiais.</h1>
    <p>As pontes sobre os rios <b>Água Preta</b>, <b>das Mortes</b> e <b>Borecaia</b> reúnem 201 itens
       medíveis. É o bloco de maior valor unitário do contrato e o de pior cobertura de composições —
       aqui a diferença entre proponentes é menos de produtividade e mais de <b>o que cada uma se
       propõe a executar</b>.</p>

    <tbody>${ordem.map(p => {
    const e = O.entrega[p];
    const cls = e.pct >= 80 ? 'ok' : e.pct >= 40 ? 'warn' : 'risk';
    return `<tr>
        <td><span style="color:${CORP[p]}">●</span> <b>${esc(p)}</b></td>
        <td class="num">${fmt(e.entregues)}</td><td class="num" style="color:var(--muted)">${e.porCodigo ? fmt(e.entregues) : fmt(e.casadas)}</td>
        <td class="num"><span class="tag ${cls}"><i></i>${fmt(e.pct, 0)}%</span></td>

  </div>
  <div class="aviso" style="margin-top:12px">
    <b>A Consag entregou 33 composições principais num PDF de 18 páginas</b>

    Não é limitação do casamento por descrição: o documento inteiro tem 130 blocos, dos quais 97 são

    <tbody>${ordem.map(p => `<tr>
      <td><span style="color:${CORP[p]}">●</span> <b>${esc(p)}</b></td>
      ${Object.keys(SIT).map(s => {
    const v = O.cobertura[p][s];

    </tr>`).join('')}</tbody></table>

  <div class="wrap card">
    <table><thead><tr><th>Família</th><th class="num">Itens</th><th class="num">Quantidade</th>

        <td class="num">${fmt(l.rendimento, 1)} ${esc(g.un)}/h</td>
        <td class="num" style="color:${Math.abs(l.desvio) > 40 ? 'var(--risk)' : 'var(--muted)'};font-weight:${Math.abs(l.desvio) > 40 ? 800 : 500}">${l.desvio > 0 ? '+' : ''}${fmt(l.desvio, 0)}%</td>
        <td class="num">${fmt(l.hhTotal)}</td>

      ${g.linhas.filter(l => !l.n).map(l => `<tr style="opacity:.55">

  <div class="aviso" style="margin-top:16px">
    <b>Dois pontos que pedem verificação antes de qualquer conclusão</b>
