argin:14px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:6px;font-size:13px;font-weight:600}input,select,textarea{width:100%;border:1px solid #bdced8;border-radius:6px;padding:10px;color:var(--ink);background:#fff}textarea{min-height:80px;resize:vertical}.full{grid-column:1/-1}.btn{border:0;border-radius:6px;padding:11px 15px;background:var(--blue);color:white;font-weight:600}.secondary{background:#e5eef3;color:var(--navy)}.warn{background:#f4a446;color:#193446}.notice{background:#fff3df;border:1px solid #dfbd82;padding:12px 14px;font-size:13px}.status{font-size:12px;font-weight:600}.status.pending{color:#9d620e}.status.sent{color:#247043}.item{border-top:1px solid var(--line);padding:18px 0}.item:first-child{border-top:0}.list{display:grid;gap:8px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.quiet{border:0;background:none;color:#245e90;padding:6px}.filelist{font-size:12px;color:var(--muted)}#message{position:fixed;bottom:15px;left:15px;right:15px;max-width:650px;margin:auto;background:#183b58;color:white;padding:12px;border-radius:6px;z-index:5}iframe{display:none}@media(max-width:550px){.form{grid-template-columns:1fr}.full{grid-column:auto}.row{align-items:start}}

/* Identidade FICO e movimento para feedback de operação. */
:root{--fico-azul:#3578bc;--fico-laranja:#f89b32;--blue:#3578bc}header{background:#fff;color:var(--navy);border-bottom:3px solid var(--fico-laranja);padding:14px 20px}.brand{max-width:760px;margin:auto;display:flex;align-items:center;gap:18px}.brand img{display:block;width:128px;height:72px;object-fit:contain}.brand span{border-left:1px solid var(--line);padding-left:18px;font-size:13px;font-weight:600}

.login-feedback{margin:12px 0 0;padding:12px 14px;border-radius:6px;font-size:14px;line-height:1.5}.login-feedback.loading{background:#eaf3fa;color:#163c5c}.login-feedback.error{background:#fff0ed;color:#96382a;border:1px solid #b84832}
</style><style>:root{--motion-fast:120ms;--motion-standard:150ms;--feedback-bg:#163c5c;--feedback-text:#fff;--feedback-muted:#d4e4ef}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
button{transition:background-color var(--motion-fast) ease,color var(--motion-fast) ease}
.btn:hover:not(:disabled){filter:brightness(.95)}
.btn.secondary:hover:not(:disabled),nav button:hover:not(:disabled){background:#dbe8f0}
button:active:not(:disabled){filter:brightness(.9)}
button:focus-visible,a:focus-visible{outline:3px solid #b76b12;outline-offset:3px}
input,textarea,select{caret-color:#3578bc;transition:border-color var(--motion-fast) ease}
input:focus,textarea:focus,select:focus{border-color:#3578bc;outline:2px solid #3578bc30;outline-offset:2px}
::selection{background:#f6d7b2;color:#163c5c}
.metric strong,.badge,#activity-time{font-variant-numeric:tabular-nums}
#activity-bubble{position:fixed;right:20px;bottom:20px;z-index:20;display:flex;align-items:center;gap:12px;width:min(360px,calc(100vw - 32px));padding:16px 18px;background:var(--feedback-bg);color:var(--feedback-text);border-radius:12px;box-shadow:0 8px 24px #00000026;animation:feedback-appear var(--motion-standard) ease-out both}
#activity-bubble[hidden]{display:none}
.activity-copy{flex:1;min-width:0}.activity-copy strong{display:block;font-size:14px;line-height:1.4}.activity-copy p{font-size:12px;line-height:1.5;margin:4px 0 0;color:var(--feedback-muted)}
.activity-mark{display:flex;align-items:center;gap:4px;flex-shrink:0}.activity-mark span{width:4px;height:4px;border-radius:50%;background:#f4a74e;animation:activity-pulse 1200ms ease-in-out infinite}.activity-mark span:nth-child(2){animation-delay:160ms}.activity-mark span:nth-child(3){animation-delay:320ms}
#activity-time{font-size:11px;color:var(--feedback-muted);white-space:nowrap;align-self:flex-start;padding-top:2px;min-width:28px;text-align:right}
button[data-processing=true]{opacity:.75;cursor:wait}
#flash,#message{position:fixed;right:20px;bottom:20px;left:auto;width:fit-content;max-width:min(400px,calc(100vw - 32px));margin:0;padding:16px 18px;border-radius:12px;box-shadow:0 8px 24px #00000021;line-height:1.5;z-index:21;animation:feedback-appear var(--motion-standard) ease-out both;background:var(--feedback-bg);color:var(--feedback-text)}
#flash[data-kind=error],#message[data-kind=error]{background:#873c2a;color:#fff}#flash[data-kind=success],#message[data-kind=success]{background:#225b49;color:#fff}
.connection-state{max-width:520px;margin:10vh auto;text-align:left}.connection-state h1{font-size:26px}.connection-state p{color:#4e677a;max-width:48ch}.connection-pulse{width:36px;height:4px;background:#f89b32;border-radius:2px;margin-bottom:20px}
@keyframes feedback-appear{from{opacity:.2}to{opacity:1}}
@keyframes activity-pulse{0%,70%,100%{opacity:.35}35%{opacity:1}}
#activity-bubble[data-paused=true] .activity-mark span{animation-play-state:paused}
@media(max-width:600px){#activity-bubble{right:16px;bottom:max(16px,env(safe-area-inset-bottom));padding:14px 16px;gap:10px}#flash,#message{right:16px;bottom:max(16px,env(safe-area-inset-bottom))}}
@media(prefers-reduced-motion:reduce){button,input,textarea,select{transition:none}#activity-bubble,#flash,#message,.activity-mark span{animation:none}.activity-mark span{opacity:1}}
@media print{#activity-bubble,#flash,#message{display:none!important}}

a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}

/* Movimento perceptível nos elementos que mudam de estado. */
nav{position:relative}nav .active{border-bottom-color:transparent}.nav-motion-indicator{position:absolute;left:0;bottom:0;height:3px;background:var(--orange,#f89b32);border-radius:3px;transform-origin:left center;pointer-events:none}
.panel,.card{border:0;border-radius:12px;box-shadow:0 4px 20px #0000000c}
.btn{box-shadow:0 3px 9px #00000018;transition:background-color 140ms ease,box-shadow 180ms ease,transform 180ms cubic-bezier(.16,1,.3,1)}
@media(hover:hover){.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 16px #00000022}}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:0 1px 4px #00000018}
#activity-bubble,#flash,#message{animation:feedback-arrive 220ms cubic-bezier(.16,1,.3,1) both}
.login{animation:content-arrive 340ms cubic-bezier(.16,1,.3,1) both}
@keyframes feedback-arrive{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes content-arrive{from{opacity:.3;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.btn{transition:none}.btn:hover:not(:disabled),.btn:active:not(:disabled){transform:none}#activity-bubble,#flash,#message,.login{animation:none}}

/* Alvos de toque de 44 px em tela sensível ao toque ou estreita */
@media(pointer:coarse),(max-width:700px){button{min-width:44px}button,.btn,select,input:not([type=checkbox]):not([type=radio]):not([type=file]){min-height:44px}a.btn,a.quiet{display:inline-flex;align-items:center;min-height:44px}}
/* Assinatura */
.assinatura{max-width:1180px;margin:0 auto;padding:28px 20px max(36px,env(safe-area-inset-bottom));text-align:center;color:#4f6a7c;font-size:13px}

function compress(file){return new Promise((resolve,reject)=>{const image=new Image(),url=URL.createObjectURL(file);image.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Não foi possível ler a foto.'))};image.onload=()=>{try{const scale=Math.min(1,1600/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);const data=canvas.toDataURL('image/jpeg',.78);if(data.length>2800000)throw new Error('Foto excede o tamanho permitido.');resolve(data)}catch(e){reject(e)}finally{URL.revokeObjectURL(url)}};image.src=url})}
function clearPhotos(n){captureInputs();draft.items.find(x=>x.num===n).photos=[];scheduleDraft();fillForm()}
async function saveDraft(){captureInputs();for(const x of draft.items){if(!x.status)return message(`Responda o item ${x.num}.`);if(draft.template==='CHUVA'&&(!x.title.trim()||!String(x.pointLocation||'').trim()))return message(`Informe o ponto e o km do item ${x.num}.`);if(x.status==='NC'&&(!x.level||!x.description.trim()))return message(`Informe a classificação e a descrição do item ${x.num}.`);if(x.status==='NC'&&x.level==='M4'&&!x.immediateAction.trim())return message(`Informe a ação imediata do item ${x.num}.`)}if(draft.items.reduce((n,i)=>n+i.photos.length,0)>12)return message('Máximo de 12 fotos por inspeção.');await task(async()=>{clearTimeout(autosaveTimer);await persistDraft();draft.status='PENDENTE';await CampoStore.put(draft);draft=null;show('queue');message('Inspeção concluída e salva neste aparelho.','success')})}
async function queueScreen(){const list=(await CampoStore.all()).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));$('app').innerHTML=`<button class="quiet" onclick="show('home')">← Início</button><div class="row"><div><span class="eyebrow">Dados no aparelho</span><h1>Fila de envio</h1></div><button class="btn" onclick="sendQueue()">Enviar pendentes</button></div><div class="notice">Mantenha a página aberta até receber a confirmação. Se o envio falhar, a coleta permanecerá pendente.</div>${list.some(x=>x.status==='PENDENTE'&&x.items.some(i=>i.status==='NC'&&i.level==='M4'))?'<div class="notice"><strong>Há uma ocorrência M4 pendente de envio.</strong> A comunicação de emergência deve ser feita pelos canais previstos; o aplicativo não envia alerta automático.</div>':''}${list.length?list.map(x=>`<div class="card"><div class="row"><div><strong>${field(x.inspection.asset)}</strong><div class="muted">${field(x.inspection.location)} · ${field(x.ownerName)}</div><small>${new Date(x.inspection.inspectedAt).toLocaleString('pt-BR')}</small></div><span class="status ${x.status==='ENVIADA'?'sent':'pending'}">${x.status==='ENVIADA'?'Enviada':x.status==='RASCUNHO'?'Rascunho':'Pendente'}</span></div>${x.sentAt?`<div class="muted">Confirmada em ${new Date(x.sentAt).toLocaleString('pt-BR')}</div>`:''}${x.status==='RASCUNHO'?`<button class="quiet" onclick="resumeDraft('${field(x.id)}')">Continuar preenchimento</button>`:''}</div>`).join(''):'<div class="card muted">Nenhuma coleta salva.</div>'}`}
async function sendQueue(){await task(async()=>{if(!account||!token)throw new Error('Entre conectado com a conta do inspetor antes de enviar.');let list=(await CampoStore.all()).filter(x=>x.status==='PENDENTE');let own=list.filter(x=>x.ownerId===account.id);if(!own.length)throw new Error(list.length?'As coletas pendentes pertencem a outro usuário.':'Não há coletas pendentes.');for(const [index,item] of own.entries()){window.FicoFeedback?.update('Enviando inspeção '+(index+1)+' de '+own.length,item.inspection.asset);const payload={ownerId:item.ownerId,inspection:item.inspection,template:item.template,items:item.items};const r=await rpc('salvarColeta',payload);if(!r.inspection?.collectionComplete||r.inspection.id!==item.id)throw new Error('Servidor não confirmou a coleta completa.');item.status='ENVIADA';item.sentAt=now();await CampoStore.put(item)}await queueScreen();message('Envio confirmado pelo servidor.','success')})}
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>message('Não foi possível preparar o acesso offline.'));initializeBridge();render().catch(err=>message(err.message));
</script></body></html>
